          const chv = $("#n_channel").value;
          const gy = $("#n_gy").value, wy = $("#n_wy").value;
          if(chv === "project" && (gy === "" || wy === "" || +gy < 0 || +gy > 30 || +wy < 0 || +wy > 30)){
            showMsg("nErr", `<div class="err">${t("For a Project, enter the guarantee and warranty years (0 to 30).")}</div>`); return;
          }
          $("#nErr").innerHTML = "";

          /* Duplicate warning: shown once, then "Register anyway" goes ahead. */
          if(!dupConfirmed){
            let dups = [];
            try { dups = await DataSource.findDuplicates({ phone: v("n_phone"), address1: v("n_addr1"),
                                                           postcode: v("n_postcode"), serial: v("n_serial") }); }
            catch(e){ dups = []; }   // never block a registration because the check failed
            if(dups.length){
              const reasonText = { "same serial number": t("same serial number"),
                                   "same site address": t("same site address"),
                                   "same phone number": t("same phone number") };
              const dupHtml = `<div class="dupwarn">
                <b>${t("Possible duplicate — please check before saving")}</b>
                <ul>${dups.slice(0, 8).map(d => `<li><a href="#/admin/${d.id}" target="_blank" rel="noopener">${esc(d.warranty_no)}</a>
                  · ${esc(d.customer_name)}${d.site_address ? " · " + esc(d.site_address) : ""}
                  <span class="pill a">${esc(reasonText[d.reason] || d.reason)}</span></li>`).join("")}</ul>
                ${(() => {
                  const typed = v("n_name").toLowerCase();
                  const owner = dups.find(d => d.reason === "same phone number");
                  return owner && owner.customer_name && owner.customer_name.toLowerCase() !== typed
                    ? `<div class="phone-owner">${t("This phone number already belongs to")} <b>${esc(owner.customer_name)}</b>. ${
                        t("Saving adds this unit under that customer, so the name and email typed here are not used. If the customer's name is wrong, correct it with Edit details on their record.")}</div>`
                    : "";
                })()}
                <div class="tiny muted">${t("If this is a different installation, press the button again to register it anyway.")}</div></div>`;
              $("#nDup").innerHTML = dupHtml;            // stays beside the button after the pop-up closes
              $("#nGo").textContent = t("Register anyway");
              dupConfirmed = true;
              duplicatePopup(dupHtml.replace(`<div class="tiny muted">${t("If this is a different installation, press the button again to register it anyway.")}</div>`,
                                             `<div class="tiny muted">${t("If this is a different installation, register it anyway.")}</div>`),
                             () => $("#nGo").click());
              return;
            }
          }
          const btn = $("#nGo"); btn.disabled = true; btn.textContent = "Saving…";
          try{
            const row = await DataSource.createWarranty({
              name:v("n_name"), phone:normalizePhone(v("n_phone")) || v("n_phone"), doNo:v("n_do"),
              address1:v("n_addr1"), address2:v("n_addr2"), postcode:v("n_postcode"),
              area:v("n_area"), state:$("#n_state").value, installDate:v("n_date"),
              units, addTo, channel:chv, lift: lf.lift, craneTons: lf.tons,
              dealer:(chv === "dealer" || chv === "contractor") ? v("n_dealer") : "",
              installer:v("n_installer"),
              projectName: chv === "project" ? v("n_proj") : "",
              guaranteeYears: chv === "project" ? Number(gy) : null,
              warrantyYears:  chv === "project" ? Number(wy) : null,
              consent: !isHist,
              historical: isHist
            });
            const made = row.created && row.created.length ? row.created : [{ warranty_no: row.warrantyNo, model_code: row.model }];
            notify("installation_registered", {
              customer_name: row.name,
              phone:         row.phone,
              area:          row.area,
              model:         made.map(u => (MODELS[u.model_code] ? MODELS[u.model_code].name : u.model_code) + (u.serial_no ? " (" + u.serial_no + ")" : "")).join(", "),
              warranty_no:   made.map(u => u.warranty_no).join(", "),
              install_date:  fmt(row.installDate),
              channel:       row.channel,
              dealer:        row.dealer,
              staff:         USER?.email || "staff"
            });
            location.hash = "#/admin/" + row.id;
          }catch(e){
            showMsg("nErr", `<div class="err">Couldn't save.<br><span class="tiny mono">${esc(e.message||e)}</span></div>`);
            btn.disabled = false; btn.textContent = "Register & generate warranty";
          }
        };
        return;
      }

      const em = r.match(/^#\/admin\/(\d+)\/edit$/);
      if(em){
        app.innerHTML = await viewEdit(em[1]);
        if($("#eSave")) wireEdit(em[1]);
        return;
      }

      const m = r.match(/^#\/admin\/(\d+)$/);
      if(m){
        app.innerHTML = await viewDetail(m[1]);
        blacklistPopup(CURRENT_RECORD);
        const btn = $("#addSvc");
        const panel = $("#svcPanel");
        if(btn && panel) btn.onclick = () => {
          $("#sv_editing").value = "";
          setVisitType(null);
          if($("#sv_unitrow")){ $("#sv_unitrow").style.display = ""; $("#sv_unit").value = String(m[1]); }
          if($("#sv_maintrow")) $("#sv_maintrow").style.display = "";
          $("#sv_save").textContent = t("Save visit");
          const cb = $("#sv_cancel"); if(cb) cb.style.display = "none";
          panel.classList.toggle("show");
        };

        const payRow = $("#sv_payrow"), chg = $("#sv_chg");
        const syncPay = () => {
          if(!payRow || !chg) return;
          const chargeable = chg.value === "yes";
          payRow.style.display = chargeable ? "" : "none";
          const d = $("#sv_due");
          if(d && !d.value) d.value = inDaysISO(30);

          /* How much was paid only makes sense for a part payment. Without it
             the whole amount showed as outstanding, which then fed the
             automatic blacklist. */
          /* File 34: the payment date shows for "Paid in full" too, and is
             kept for a part payment (it used to be thrown away). */
          const pay = $("#sv_pay"), paidRow = $("#sv_paidrow");
          const ps = pay ? pay.value : "unpaid";
          if(paidRow) paidRow.style.display = (chargeable && (ps === "partial" || ps === "paid")) ? "" : "none";
          const amtWrap = $("#sv_paidamt");
          if(amtWrap) amtWrap.style.display = ps === "partial" ? "" : "none";
          const po = $("#sv_paidon");
          if(po && chargeable && ps === "paid" && !po.value) po.value = todayISO();
        };
        if(chg){ chg.onchange = syncPay; }
        const payStatusSel = $("#sv_pay");
        if(payStatusSel) payStatusSel.onchange = syncPay;
        syncPay();

        /* Older visits hold free text like "Repair" that matches none of the
           five options. Dropping to option 0 would quietly relabel a fault
           visit as routine servicing and erase it from the repeat-repair
           count — the exact evidence loss that voiding exists to prevent. */
        const setVisitType = (v) => {
          const sel = $("#sv_type"); if(!sel) return;
          const ti = v ? VISIT_TYPES.findIndex(x => x.v === v.type) : -1;
          let keep = sel.querySelector('option[value="keep"]');
          if(v && ti < 0){
            if(!keep){
              keep = document.createElement("option");
              keep.value = "keep";
              sel.appendChild(keep);
            }
            keep.textContent = v.type + (v.fault ? " \u2014 " + t("Fault") : "");
            sel.value = "keep";
          } else {
            if(keep) keep.remove();
            sel.value = ti >= 0 ? ti : 0;
          }
        };

        /* ---- maintenance schedule ---- */
        document.querySelectorAll("[data-maint]").forEach(el => {
          const itemId  = Number(el.dataset.maint);
          const doneBtn = el.querySelector("[data-done]");
          const iv      = el.querySelector("[data-interval]");

          if(doneBtn) doneBtn.onclick = async () => {
            if(draftInProgress() &&
               !confirm(t("You have something typed in the visit form. Saving this will clear it. Continue?"))) return;
            doneBtn.disabled = true; doneBtn.textContent = "…";
            try{
              const d = el.querySelector("[data-donedate]");
              await DataSource.markMaintenanceDone(itemId, d ? d.value : null);
              render();
            }catch(e){
              alert(e.message || e);
              doneBtn.disabled = false; doneBtn.textContent = t("Mark as done");
            }
          };

          if(iv) iv.onchange = async () => {
            if(draftInProgress() &&
               !confirm(t("You have something typed in the visit form. Saving this will clear it. Continue?"))){
              render(); return;
            }
            try{ await DataSource.setMaintenanceInterval(itemId, iv.value); render(); }
            catch(e){ alert(e.message || e); }
          };
        });

        const mf = $("#mFilter");
        if(mf){
          const saveFilter = async () => {
            const row = $("#mFilterRow");
            if(row) row.style.display = mf.checked ? "" : "none";
            const box = $("#mFilterMsg"), fd = $("#mFilterDate");
            try{
              await DataSource.setInstallationFilter(
                Number(m[1]), mf.checked, mf.checked && fd ? (fd.value || null) : null);
              if(box) box.innerHTML = `<div class="ok" style="margin-top:10px">${t("Saved.")}</div>`;
              setTimeout(render, 700);
            }catch(e){
              if(box) box.innerHTML = `<div class="err" style="margin-top:10px">${esc(e.message || e)}</div>`;
            }
          };
          mf.onchange = () => {
            /* One stray click used to switch the back-wash schedule off
               immediately. Ask first when switching it off; switching it on
               needs no confirmation because nothing is lost. */
            if(!mf.checked &&
               !confirm(t("Turn off the water filter reminders for this customer?"))){
              mf.checked = true; return;
            }
            saveFilter();
          };
          const fd = $("#mFilterDate"); if(fd) fd.onchange = saveFilter;
        }

        const doBl = async (on) => {
          const reason = prompt(on
            ? t("Why is this customer being blacklisted?")
            : t("Why is the blacklist being removed?"));
          if(reason === null) return;                     // they pressed Cancel
          if(reason.trim().length < 3){ alert(t("A reason is required.")); return; }
          try {
            // `r` in this scope is the route string ("#/admin/5"), not the
            // customer — which is why the first version of this email arrived
            // with every field undefined. CURRENT_RECORD is already loaded,
            // and carries customerId, so no extra queries are needed here.
            const rec = CURRENT_RECORD || await DataSource.getById(m[1]);
            await DataSource.setBlacklist(rec.customerId, on, reason.trim());
            notify("blacklist_changed", {
              customer_name: rec ? rec.name : "(unknown)",
              phone:         rec ? rec.phone : "",
              area:          rec ? rec.area : "",
              warranty_no:   rec ? rec.warrantyNo : "",
              model:         rec && MODELS[rec.model] ? MODELS[rec.model].name : "",
              action:        on ? "added" : "removed",
              reason:        reason.trim(),
              staff:         USER?.email || "staff"
            });
            render();
          } catch(e){ alert(e.message || e); }
        };
        const bOn = $("#blOn"), bOff = $("#blOff");
        if(bOn)  bOn.onclick  = () => doBl(true);
        if(bOff) bOff.onclick = () => doBl(false);

        const eBtn = $("#recEdit");
        if(eBtn) eBtn.onclick = () => { location.hash = "#/admin/" + m[1] + "/edit"; };
        const pBtn = $("#recPrint");
        if(pBtn) pBtn.onclick = () => printHistory(CURRENT_RECORD);
        const rmBtn = $("#recRemove");
        if(rmBtn) rmBtn.onclick = async () => {
          const reason = prompt(t("Why is this record being removed? It can be restored later by an admin."));
          if(reason === null) return;
          if(reason.trim().length < 3){ alert(t("A reason is required.")); return; }
          try { await DataSource.removeInstallation(m[1], reason.trim()); render(); }
          catch(e){ alert(e.message || e); }
        };
        const rsBtn = $("#recRestore");
        if(rsBtn) rsBtn.onclick = async () => {
          try { await DataSource.restoreInstallation(m[1]); render(); }
          catch(e){ alert(e.message || e); }
        };
        const dlBtn = $("#recDelete");
        if(dlBtn) dlBtn.onclick = () => deletePopup(CURRENT_RECORD);

        /* Edit / remove / restore on each visit row.
           Removing is a soft delete — the record stays, greyed out, with the
           reason. Voided visits stop counting toward the repeat-repair alert
           and the payment totals, but nobody can quietly erase a callback. */
        document.querySelectorAll("[data-visit]").forEach(row => {
          const vid = row.dataset.visit;
          const v = (CURRENT_RECORD ? CURRENT_RECORD.service : [])
                      .find(x => String(x.id) === String(vid));

          const eb = row.querySelector("[data-edit]");
          if(eb) eb.onclick = () => {
            if(!v || !panel) return;
            panel.classList.add("show");
            $("#sv_editing").value = vid;
            $("#sv_date").value  = v.date;
            setVisitType(v);
            $("#sv_tech").value  = v.tech || "";
            $("#sv_parts").value = v.parts || "";
            if($("#sv_sn2")) $("#sv_sn2").value = v.secondary || "";
            if($("#sv_form")) $("#sv_form").value = v.formNo || "";
            if($("#sv_inv"))  $("#sv_inv").value  = v.invoiceNo || "";
            /* A saved visit stays on its unit; maintenance is ticked when logging. */
            if($("#sv_unitrow")) $("#sv_unitrow").style.display = "none";
            if($("#sv_maintrow")) $("#sv_maintrow").style.display = "none";
            if($("#sv_lift")){ $("#sv_lift").value = v.lift || "none"; $("#sv_tons").value = v.craneTons ?? ""; syncLift("sv"); }
            $("#sv_chg").value   = v.chargeable ? "yes" : "no";
            $("#sv_amt").value   = v.amount ?? "";
            syncPay();
            if($("#sv_pay")) $("#sv_pay").value = v.payStatus === "not_applicable" ? "unpaid" : v.payStatus;
            if($("#sv_due")) $("#sv_due").value = v.dueOn || "";
            if($("#sv_paid")) $("#sv_paid").value = v.amountPaid ?? "";
            if($("#sv_paidon")) $("#sv_paidon").value = v.paidOn || "";
            syncPay();
            $("#sv_note").value  = v.note || "";
            $("#sv_save").textContent = t("Update visit");
            $("#sv_cancel").style.display = "";
            panel.scrollIntoView({ behavior:"smooth", block:"center" });
          };

          const vb = row.querySelector("[data-void]");
          if(vb) vb.onclick = async () => {
            const reason = prompt(t("Why is this visit being removed?"));
            if(reason === null) return;                   // they pressed Cancel
            if(reason.trim().length < 3){ alert(t("A reason is required.")); return; }
            try { await DataSource.voidServiceVisit(vid, reason.trim()); render(); }
            catch(e){ alert(e.message || e); }
          };

          const rb = row.querySelector("[data-restore]");
          if(rb) rb.onclick = async () => {
            try { await DataSource.restoreServiceVisit(vid); render(); }
            catch(e){ alert(e.message || e); }
          };
        });

        const cancelBtn = $("#sv_cancel");
        if(cancelBtn) cancelBtn.onclick = () => {
          $("#sv_editing").value = "";
          $("#sv_save").textContent = t("Save visit");
          cancelBtn.style.display = "none";
          if(panel) panel.classList.remove("show");
        };

        const saveBtn = $("#sv_save");
        if(saveBtn) saveBtn.onclick = async () => {
          const editingIdNow = $("#sv_editing").value;
          const rawType = $("#sv_type").value;
          let vt;
          if(rawType === "keep"){
            const prev = (CURRENT_RECORD ? CURRENT_RECORD.service : [])
                           .find(x => String(x.id) === String(editingIdNow));
            vt = prev ? { v: prev.type, fault: prev.fault === true }
                      : { v: "Routine service", fault: false };
          } else {
            vt = VISIT_TYPES[Number(rawType)] || VISIT_TYPES[0];
          }
          if(!$("#sv_date").value){
            $("#svErr").innerHTML = `<div class="err">Visit date is required.</div>`; return;
          }
          const lfv = readLift("sv");
          if(lfv.error){ $("#svErr").innerHTML = `<div class="err">${lfv.error}</div>`; return; }
          if($("#sv_note").value.trim().length < 2){
            $("#svErr").innerHTML = `<div class="err">Please record what was done — this is what stops the same fault being guessed at twice.</div>`; return;
          }
          saveBtn.disabled = true; saveBtn.textContent = "Saving…";
          const editingId = $("#sv_editing").value;
          try{
            if (editingId) {
              await DataSource.updateServiceVisit(editingId, {
                date:  $("#sv_date").value, type: vt.v, fault: vt.fault,
                tech:  $("#sv_tech").value.trim(),
                parts: $("#sv_parts").value.trim(),
                chargeable: $("#sv_chg").value === "yes",
                amount: $("#sv_amt").value,
                payStatus: $("#sv_pay") ? $("#sv_pay").value : "unpaid",
                dueOn: $("#sv_due") ? $("#sv_due").value : null,
                amountPaid: $("#sv_paid") ? $("#sv_paid").value : null,
                paidOn: $("#sv_paidon") ? $("#sv_paidon").value : null,
                note: $("#sv_note").value.trim(),
                secondary: $("#sv_sn2") ? $("#sv_sn2").value.trim() : "",
                formNo: $("#sv_form") ? $("#sv_form").value.trim() : "",
                invoiceNo: $("#sv_inv") ? $("#sv_inv").value.trim() : "",
                lift: lfv.lift, craneTons: lfv.tons
              });
              render();
              return;
            }
            const unitId = $("#sv_unit") ? $("#sv_unit").value : m[1];
            const updated = await DataSource.addServiceVisit(Number(unitId), {
              date:  $("#sv_date").value,
              type:  vt.v,
              fault: vt.fault,
              tech:  $("#sv_tech").value.trim() || (USER?.email || "Staff"),
              parts: $("#sv_parts").value.trim(),
              chargeable: $("#sv_chg").value === "yes",
              amount: $("#sv_amt").value,
              payStatus: $("#sv_pay") ? $("#sv_pay").value : "unpaid",
              dueOn: $("#sv_due") ? $("#sv_due").value : null,
              amountPaid: $("#sv_paid") ? $("#sv_paid").value : null,     // file 34: was not sent for a new visit
              paidOn: $("#sv_paidon") ? $("#sv_paidon").value : null,
              note:  $("#sv_note").value.trim(),
              secondary: $("#sv_sn2") ? $("#sv_sn2").value.trim() : "",
              formNo: $("#sv_form") ? $("#sv_form").value.trim() : "",
              invoiceNo: $("#sv_inv") ? $("#sv_inv").value.trim() : "",
              lift: lfv.lift, craneTons: lfv.tons
            });

            /* Maintenance ticked on this visit restarts from the visit date. */
            const mCodes = [...document.querySelectorAll("[data-mtask]:checked")].map(x => x.dataset.mtask);
            if(mCodes.length){
              try { await DataSource.markMaintenanceOnVisit(unitId, mCodes, $("#sv_date").value, $("#sv_note").value.trim()); }
              catch(e){ alert(t("The visit was saved, but the maintenance schedule could not be updated:") + " " + (e.message || e)); }
            }

            /* The whole point of the feature: the moment a unit crosses the
               threshold, tell the owners. Don't wait for tomorrow's digest. */
            const f = faultVisitsInWindow(updated.service);
            if (vt.fault && f.length >= REPEAT_THRESHOLD) {
              notify("repeat_repair_alert", {
                customer_name: updated.name,
                phone:         updated.phone,
                area:          updated.area,
                warranty_no:   updated.warrantyNo,
                model:         MODELS[updated.model] ? MODELS[updated.model].name : updated.model,
                fault_count:   f.length,
                window_months: REPEAT_WINDOW_MONTHS,
                visits:        f.slice().reverse().map(x =>
                                 `${fmt(x.date)} — ${x.type}${x.parts ? " (" + x.parts + ")" : ""}`).join(" | "),
                staff:         USER?.email || "staff"
              });
            }
            /* Saved on another of the customer's units: go to that unit. */
            if(String(unitId) !== String(m[1])){ location.hash = "#/admin/" + unitId; return; }
            render();
          }catch(e){
            $("#svErr").innerHTML = `<div class="err">Couldn't save.<br><span class="tiny mono">${esc(e.message||e)}</span></div>`;
            saveBtn.disabled = false; saveBtn.textContent = "Save visit";
          }
        };
        return;
      }

      app.innerHTML = await viewList();
      const wire = () => {
        const setSelects = () => {
          $("#fs").value = FILTER.status; $("#fc").value = FILTER.channel;
          $("#ff").value = FILTER.faults; $("#fp").value = FILTER.pay;
        };
        /* Redraw the list WITHOUT replacing the search box. The old way
           rebuilt the box too and put the cursor back where it was before
           the search went off — anything typed while the results were
           loading moved the cursor or was lost. The box the person is
           typing in now stays exactly as it is, and an older search that
           comes back late is ignored. */
        const redraw = async () => {
          const ticket = ++LIST_DRAW;
          const html = await viewList();
          if(ticket !== LIST_DRAW) return;           // a newer search is on its way
          const live = $("#q");
          const tmp = document.createElement("div");
          tmp.innerHTML = html;
          const fresh = tmp.querySelector("#q");
          const typing = !!live && live === document.activeElement;
          const s0 = typing ? live.selectionStart : null, s1 = typing ? live.selectionEnd : null;
          if(live && fresh){
            if(live.value !== FILTER.q && !typing) live.value = FILTER.q;
            fresh.replaceWith(live);
          }
          app.replaceChildren(...tmp.childNodes);
          // Same moment, so nothing typed can slip in between.
          if(typing){ live.focus({ preventScroll: true }); try { live.setSelectionRange(s0, s1); } catch(e) {} }
          setSelects();
          wire();
        };

        // One tap on a summary card filters the list to exactly those records.
        // Far easier for non-technical staff than working out which dropdown.
        document.querySelectorAll("[data-card]").forEach(b => b.onclick = () => {
          const k = b.dataset.card;
          FILTER.faults = "all"; FILTER.pay = "all"; FILTER.status = "all";
          if(k === "repeats")      FILTER.faults = "2";
          else if(k === "unpaid")  FILTER.pay    = "unpaid";
          else if(k === "expired") FILTER.status = "expired";
          PAGE = 0; redraw();
        });

        const ft = $("#fToggle");
        if(ft) ft.onclick = () => { FILTERS_OPEN = !FILTERS_OPEN; redraw(); };

        const fr = $("#fRemoved");
        if(fr) fr.onclick = () => {
          FILTER.status = FILTER.status === "removed" ? "all" : "removed";
          PAGE = 0; redraw();
        };
        const fc = $("#fClear");
        if(fc) fc.onclick = () => {
          FILTER.status = "all"; FILTER.channel = "all";
          FILTER.faults = "all"; FILTER.pay = "all"; FILTER.q = "";
          if($("#q")) $("#q").value = "";
          PAGE = 0; redraw();
        };

        $("#q").oninput = () => {
          FILTER.q = $("#q").value; PAGE = 0;
          clearTimeout(SEARCH_TIMER);
          SEARCH_TIMER = setTimeout(redraw, 300);
        };
        [["fs","status"],["fc","channel"],["ff","faults"],["fp","pay"]].forEach(([id,key]) => {
          const el = $("#"+id);
          if(el) el.onchange = () => { FILTER[key] = el.value; PAGE = 0; redraw(); };
        });
        const pp = $("#pgPrev"), pn = $("#pgNext");
        if(pp) pp.onclick = () => { if(PAGE>0){ PAGE--; redraw(); } };
        if(pn) pn.onclick = () => { PAGE++; redraw(); };
        document.querySelectorAll("#tb tr[data-id]").forEach(tr =>
          tr.onclick = () => location.hash = "#/admin/" + tr.dataset.id);
        setSelects();
      };
      wire();
    }catch(e){
      app.innerHTML = `<div class="page"><div class="err">
        Couldn't load data from the database.<br>
        <span class="tiny mono">${esc(e.message||e)}</span><br><br>
        <span class="tiny">Check that both SQL files have been run, and that you're signed in.</span>
      </div></div>`;
    }
    return;
  }

  location.hash = "#/check";
}

/* The three models are also written into this file so the coverage bar can be
   drawn without waiting for a round trip. The database is the real list, so
   read it over the top — otherwise a model added later cannot be registered
   and breaks the registry page. */
async function loadModels(){
  try{
    const { data } = await sb.from("models").select("*").order("code");
    (data || []).forEach(m => {
      MODELS[m.code] = {
        name: m.name, litres: m.litres, gallons: m.gallons, pax: m.pax || "\u2014",
        guaranteeYears: m.guarantee_years, warrantyYears: m.warranty_years,
        steel: m.steel || "\u2014", tubes: m.copper_tubes || "\u2014",
        panel: m.panel_size || "\u2014",
        brand: m.brand || "", category: m.category || "", kind: m.kind || "heater",
        sortOrder: m.sort_order, note: m.warranty_note || "", active: m.active !== false
      };
    });
  }catch(e){ /* keep the built-in list */ }
}

(async function boot(){
  await loadModels();
  USER = await DataSource.currentUser();
  if (USER) {
    // A session restored from a previous visit has unknown age — treat the
    // stored stamp as the truth, and if there isn't one, start the clock now.
    if (!sessionStart()) setSessionStart(Date.now());
    const started = sessionStart();
    if (Date.now() - started > MAX_SESSION_HRS * 3600e3) {
      await forceSignOut("Your previous session expired. Please sign in again.");
      return;
    }
    /* The idle clock used to restart on every reload, so a machine left
       signed in overnight was wide open after a refresh. Trust the stored
       stamp instead. */
    const seen = lastActivityStored();
    lastActivity = seen || 0;
    if (Date.now() - lastSeen() > IDLE_LIMIT_MIN * 60e3) {
      await forceSignOut("You were signed out because the system was left idle. Please sign in again.");
      return;
    }
    startSessionGuard();
    await refreshAdmin();
    try { FU_COUNT = await DataSource.countFollowups(); } catch(e) { FU_COUNT = 0; }
  }
  render();
})();
</script>
