<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MySolar — Warranty Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#006C9C; --blue-deep:#004A6B; --blue-night:#0A2B38; --tint:#EDF4F8;
  --green:#0F7B4F; --green-bg:#E4F4EC;
  --amber:#9A6410; --amber-bg:#FCF0DC;
  --red:#A32A20;  --red-bg:#FBE9E7;
  --grey:#5A6B74; --line:#D8E2E7; --ink:#12242D; --paper:#fff; --bg:#F5F8FA;
  --sans:'Public Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2;font-weight:700;letter-spacing:-.015em}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1rem}
a{color:var(--blue)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}

.demoflag{background:var(--blue-night);color:#F0B429;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:7px}
.topnav{background:var(--blue-night);color:#fff}
.topnav .in{max-width:1240px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:700;font-size:1.06rem;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#7FB4C8;font-weight:500}
.navbtns{display:flex;gap:8px;align-items:center}
.navbtns a,.navbtns button{color:#BBD8E4;text-decoration:none;font-size:.88rem;font-weight:600;padding:7px 13px;border-radius:4px;background:none;border:0;cursor:pointer}
.navbtns a:hover,.navbtns button:hover{background:rgba(255,255,255,.1);color:#fff}
.navbtns a.on{background:var(--blue);color:#fff}
#langBtn{border:1px solid rgba(255,255,255,.3);border-radius:4px;font-size:.8rem;padding:5px 11px}
/* Phones: the six signed-in buttons were wider than the screen, which made
   the browser zoom every page out. Let them wrap onto a second line. */
@media(max-width:600px){
  .topnav .in{padding:10px 14px}
  .navbtns{flex-wrap:wrap;gap:4px;width:100%}
  .navbtns a,.navbtns button{padding:6px 9px;font-size:.84rem}
}

.page{max-width:1240px;margin:0 auto;padding:26px 22px 60px}
.narrow{max-width:620px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:7px}
.card-pad{padding:22px}
/* Labels were 11px uppercase monospace — that reads as developer tooling.
   Sentence case in the body font reads as ordinary business software. */
label{display:block;font-family:var(--sans);font-size:.9rem;font-weight:600;
  letter-spacing:0;text-transform:none;color:var(--ink);margin-bottom:7px}
input,select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:6px;
  font-family:var(--sans);font-size:1rem;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}
input:focus,select:focus{border-color:var(--blue);outline:none}
select{font-family:var(--sans)}
.field{margin-bottom:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.row2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1.5px solid transparent;border-radius:6px;padding:13px 22px;font-size:1rem;
  font-weight:600;cursor:pointer;text-decoration:none;transition:.14s}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-deep)}
.btn-p[disabled]{opacity:.6;cursor:wait}
.btn-s{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--blue);color:var(--blue)}
.btn-full{width:100%}
.err{background:var(--red-bg);color:var(--red);border:1px solid #F0C7C2;border-radius:5px;padding:11px 13px;font-size:.9rem;margin-bottom:14px}
.ok{background:var(--green-bg);color:var(--green);border:1px solid #BFE3D1;border-radius:5px;padding:11px 13px;font-size:.9rem;margin-bottom:14px}
.muted{color:var(--grey)} .tiny{font-size:.85rem}

.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:.8rem;
  font-weight:600;letter-spacing:0;text-transform:none;padding:5px 11px;border-radius:99px;
  white-space:nowrap}
.pill.g{background:var(--green-bg);color:var(--green)}
.pill.w{background:var(--tint);color:var(--blue-deep)}
.pill.x{background:var(--red-bg);color:var(--red)}
.pill.n{background:#EEF1F3;color:var(--grey)}
.pill.a{background:var(--amber-bg);color:var(--amber)}

.hero-c{background:linear-gradient(155deg,var(--blue) 0%,var(--blue-deep) 100%);color:#fff;padding:40px 22px 46px}
.hero-c .in{max-width:620px;margin:0 auto}
.hero-c h1{font-size:1.85rem;color:#fff}
.hero-c p{color:#C4E0EC;margin:10px 0 0}
.lookup-card{max-width:620px;margin:-30px auto 0;position:relative}
.result-hd{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.result-hd .model{font-size:1.25rem;font-weight:700}
.timeline{padding:20px 22px;border-bottom:1px solid var(--line)}
.bar{height:9px;background:#E6ECEF;border-radius:99px;overflow:hidden;margin:9px 0 7px;position:relative}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;position:relative;z-index:2}
.bar .g{position:absolute;top:0;left:0;height:100%;background:var(--green);border-radius:99px;opacity:.85}
.barlbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;color:var(--grey);letter-spacing:.06em}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:12px 20px;margin:0;padding:20px 22px}
dl.kv dt{color:var(--grey);font-size:.95rem}
dl.kv dd{margin:0;font-family:var(--sans);font-size:.95rem;font-weight:600;text-align:right}
.svc{padding:18px 22px;border-top:1px solid var(--line)}
.svc-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.svc-item:last-child{border-bottom:0}
.svc-item .d{font-family:var(--mono);font-size:.82rem;color:var(--grey);white-space:nowrap;min-width:92px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;
  padding:18px 20px;text-align:left;width:100%;font-family:var(--sans)}
button.stat{cursor:pointer;transition:.14s}
button.stat:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(0,108,156,.12)}
button.stat.on{border-color:var(--blue);border-width:2px;background:var(--tint)}
.stat b{display:block;font-size:2rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-bottom:3px}
.stat span{font-family:var(--sans);font-size:.88rem;letter-spacing:0;
  text-transform:none;color:var(--grey);font-weight:500}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.toolbar .field{margin:0}
.toolbar .grow{flex:1;min-width:210px}
table{width:100%;border-collapse:collapse;background:var(--paper)}
th{text-align:left;font-family:var(--sans);font-size:.85rem;letter-spacing:0;
  text-transform:none;color:var(--grey);font-weight:600;padding:13px 16px;
  border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:15px 16px;border-bottom:1px solid var(--line);font-size:.96rem;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--tint)}
/* Blacklisted rows are shaded, not just tagged — staff scanning a long list
   should see it without reading. */
tbody tr.row-bl{background:var(--red-bg)}
tbody tr.row-bl:hover{background:#F7DBD7}
tbody tr.row-bl td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tbody tr.row-bl td{color:#6B1F18}
tbody tr.row-bl td b{color:var(--red)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
.src{font-family:var(--sans);font-size:.84rem;color:var(--grey)}
.empty{padding:44px 20px;text-align:center;color:var(--grey)}
.crumb{background:none;border:0;color:var(--blue);font-weight:600;font-size:.9rem;cursor:pointer;padding:0;margin-bottom:14px}
.detail-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr}}
.sec-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:1.05rem;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.claim{padding:13px 18px;border-bottom:1px solid var(--line);font-size:.9rem}
.claim:last-child{border-bottom:0}
.badge{background:var(--amber);color:#3A2600;border-radius:99px;padding:1px 7px;font-size:.74rem;font-weight:700}
.fu{background:var(--paper);border:1px solid var(--line);border-radius:7px;margin-bottom:10px}
.fu-main{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.fu-name{font-weight:700;font-size:1.02rem;margin-top:7px}
.fu-acts{display:flex;gap:7px;flex-wrap:wrap}
.fu-panel{display:none;padding:15px 18px;border-top:1px solid var(--line);background:var(--tint)}
.fu-panel.show{display:block}
.fu-opts{display:flex;gap:7px;flex-wrap:wrap}
.sk{height:46px;background:linear-gradient(90deg,#EDF1F3 25%,#F6F8F9 50%,#EDF1F3 75%);
  background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:6px;margin-bottom:10px}
.sk-lg{height:82px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
.searchbar{display:flex;gap:10px;margin-bottom:14px}
.searchbar input{flex:1}
.searchbar .btn{white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-left:4px}
.filters{display:none;gap:14px;flex-wrap:wrap;margin-bottom:18px;padding:18px;
  background:var(--tint);border-radius:8px}
.filters.show{display:flex}
.filters .field{margin:0;min-width:180px;flex:1}
.pager{display:flex;justify-content:space-between;align-items:center;gap:14px;
  flex-wrap:wrap;margin-top:14px}
.pgbtns{display:flex;align-items:center;gap:10px}
.pgbtns .btn{padding:8px 16px;font-size:.88rem}
.pgbtns .btn[disabled]{opacity:.45;cursor:default}
.claim.voided{opacity:.55}
.claim.voided b{text-decoration:line-through}
.lnk{background:none;border:0;color:var(--blue);font-size:.84rem;font-weight:600;
  cursor:pointer;padding:0;margin-right:14px;text-decoration:underline}
.lnk:hover{color:var(--blue-deep)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{background:#fff;border:1.5px solid var(--line);border-radius:5px;padding:9px 15px;
  font-size:.9rem;font-weight:600;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:7px}
.tab:hover{border-color:var(--blue);color:var(--blue)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tabn{background:rgba(0,0,0,.12);border-radius:99px;padding:1px 7px;font-size:.78rem}
.tab.on .tabn{background:rgba(255,255,255,.25)}
#printArea{display:none}
@media print{
  body.printing > *:not(#printArea){display:none !important}
  body.printing #printArea{display:block}
  body.printing{background:#fff}
  .ph{font-family:var(--sans);color:#000;font-size:11pt}
  .ph-top{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px;font-size:13pt}
  .ph-top span{font-size:9pt;font-weight:400}
  .ph h4{margin:14px 0 6px;font-size:11.5pt}
  .ph-kv th{text-align:left;font-weight:600;padding:2px 14px 2px 0;vertical-align:top;white-space:nowrap}
  .ph-kv td{padding:2px 0}
  .ph-t{width:100%;border-collapse:collapse;font-size:9.5pt}
  .ph-t th,.ph-t td{border:1px solid #888;padding:4px 6px;text-align:left;vertical-align:top}
  .ph-t th{background:#eee}
  .ph-t tr{page-break-inside:avoid}
  .ph-foot{margin-top:16px;font-size:8.5pt;color:#444}
}
.edit-row{padding:8px 0;border-bottom:1px solid var(--line)}
.edit-row:last-child{border-bottom:0}
.edit-row ul{margin:4px 0 0;padding-left:18px;font-size:.86rem}
.removed-note{background:#EEF1F3;border:1px solid var(--line);border-radius:7px;padding:10px 14px;margin:0 0 12px;font-size:.9rem}
.dupwarn{background:var(--amber-bg);border:1px solid #EFD9AE;border-radius:7px;padding:12px 14px;margin:0 0 12px;color:var(--ink)}
.phone-owner{background:#fff;border:1px solid #EFD9AE;border-radius:5px;padding:8px 10px;margin:8px 0;font-size:.88rem}
.dupwarn ul{margin:8px 0;padding-left:18px}
.dupwarn li{margin:4px 0;font-size:.9rem}
fieldset.addr{border:1px solid var(--line);border-radius:7px;padding:10px 14px 4px;margin:0 0 14px}
fieldset.addr legend{font-size:.82rem;font-weight:600;color:var(--grey);padding:0 6px}
.svc-kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:6px 0 0;font-size:.85rem}
.svc-kv dt{color:var(--grey)}
.svc-kv dd{margin:0;overflow-wrap:anywhere}
.idlewarn{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:200;
  background:var(--ink);color:#fff;padding:13px 18px;border-radius:6px;font-size:.92rem;
  box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;align-items:center;max-width:92vw}
.consent{border:1.5px solid var(--line);border-radius:5px;padding:14px;background:var(--tint);margin-bottom:16px}
.privacy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
@media(max-width:1180px){.privacy-grid{grid-template-columns:1fr 1fr}}
.privacy-grid p{font-size:.93rem}
@media(max-width:820px){.privacy-grid{grid-template-columns:1fr}}
.spin{padding:50px 20px;text-align:center;color:var(--grey);font-family:var(--mono);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase}
/* Activity log: one card per line on a phone instead of a wide table. */
@media (max-width:640px){
  table.act thead{display:none}
  table.act, table.act tbody{display:block}
  table.act tr{display:block;padding:12px 14px;border-bottom:1px solid var(--line)}
  table.act td{display:block;border:0;padding:2px 0;min-width:0!important}
  table.act td.act-when{font-size:.8rem;color:var(--grey)}
  table.act td.act-when .src{display:inline;margin-left:6px}
}
/* Registration: one line per unit (file 33). Product above serial on a phone. */
.unit-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:10px;align-items:end;
  border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:8px}
@media (max-width:560px){
  .unit-row{grid-template-columns:minmax(0,1fr) auto}
  .unit-row .u-model{grid-column:1 / -1}
}
</style>
</head>
<body>

<div class="demoflag" id="flag">MySolar Warranty Registry</div>

<div class="topnav">
  <div class="in">
    <div class="brand">MySolar <span>Warranty Registry</span></div>
    <div class="navbtns" id="nav"></div>
  </div>
</div>

<div id="cfgWarn"></div>
<div id="app"><div class="page"><div class="sk sk-lg"></div><div class="sk"></div><div class="sk"></div></div></div>

<script>
/* ============================================================================
   PRODUCT DEFINITIONS
   Kept in the browser as well as the database so the coverage bar can be
   drawn without an extra round trip.
   ========================================================================== */
const MODELS = {
  "MY40-S3": { name:"MySolar MY40 Series 3", litres:180, gallons:40, pax:"Up to 4",
               guaranteeYears:3, warrantyYears:9, steel:"1.5mm AISI 304", tubes:10, panel:"21 sq ft" },
  "MY60-S1": { name:"MySolar MY60 Series 1", litres:276, gallons:60, pax:"4 to 6",
               guaranteeYears:1, warrantyYears:9, steel:"1.2mm AISI 304", tubes:14, panel:"42 sq ft" },
  "MY60-S3": { name:"MySolar MY60 Series 3", litres:276, gallons:60, pax:"6 to 8",
               guaranteeYears:3, warrantyYears:9, steel:"1.5mm AISI 304", tubes:20, panel:"42 sq ft" }
};

/* ============================================================================
   DATA LAYER — Supabase
   The anon key belongs in the browser. It is safe ONLY because Row Level
   Security is switched on. Never paste the service_role key here.
   ========================================================================== */
const SUPABASE_URL      = "https://qgymojsvkshvfuphwtql.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFneW1vanN2a3NodmZ1cGh3dHFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNzg2MTAsImV4cCI6MjEwNTY1NDYxMH0.D3-VEsBaceGEtn-TkK0Ufwar1pODulFoBtYtOviC3oY";

/* If the database library did not load — a blocked CDN, a dead connection —
   say so. Before this, the page sat on the grey loading blocks forever. */
if (!window.supabase || !window.supabase.createClient) {
  document.getElementById("app").innerHTML =
    '<div class="page"><div class="card card-pad">' +
    '<h2>Could not start</h2>' +
    '<p>The page could not load the part it needs to reach the database. ' +
    'This is usually a network or firewall problem rather than a fault in the ' +
    'system itself.</p><p>Please check the internet connection and reload. ' +
    'If it keeps happening on the office network, the address ' +
    '<span class="mono">cdn.jsdelivr.net</span> may be blocked.</p></div></div>';
  throw new Error("Supabase library failed to load");
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* --- Instant email notifications (Google Apps Script web app) -------------
   Paste the /exec URL from your Apps Script deployment below, and the same
   NOTIFY_SECRET you set in its Script Properties.
   Leave NOTIFY_URL empty to switch notifications off entirely. */
const NOTIFY_URL    = "https://script.google.com/macros/s/AKfycbw4I6Jpe_DJ8Y4cVfug4_QDFobtwsx1DC40u0Mtq7DHx4GQwoWusMGQpCq_SAQygU5X/exec";
const NOTIFY_SECRET = "mysolar-notify-7fk29x";   /* <-- must match NOTIFY_SECRET in Apps Script Script Properties */

/* If the line above is still the example text, emails are silently thrown away
   by Apps Script and nothing on screen says so. This flag drives a visible
   warning instead, so a forgotten paste can never go unnoticed again. */
const NOTIFY_READY = !!NOTIFY_URL && NOTIFY_SECRET !== "PASTE_YOUR_NOTIFY_SECRET_HERE";

/* Leave EMPTY on the live site. On the staging (test) copy set it to
   "STAGING" — every screen then shows a red bar, so the test copy can never
   be mistaken for the real system. */
const ENV_LABEL = "";

/* Dates, in Malaysian time rather than UTC.
   toISOString() is UTC, and Malaysia is eight hours ahead — so before 8am it
   returns YESTERDAY. Every default date in this app goes through here. */
function todayISO(d){
  const x = d ? new Date(d) : new Date();
  return new Date(x.getTime() - x.getTimezoneOffset() * 60000)
           .toISOString().slice(0, 10);
}
function inDaysISO(n){
  const d = new Date(); d.setDate(d.getDate() + n); return todayISO(d);
}

/* Fields a person may have typed into. Checked before anything that rebuilds
   the page, so a half-written note is never thrown away without asking. */
const DRAFT_FIELDS = ["sv_note","sv_tech","sv_parts","sv_amt","sv_form","sv_inv","n_do",
                      "n_name","n_phone","n_addr1","n_addr2","n_postcode","n_area","n_serial","wn","pn"];
/* The edit form starts filled in, so "something typed" there means changed
   from what was loaded — checked separately in draftInProgress(). */

/* Malaysian states and federal territories, as stored in the database. */
const MY_STATES = ["Johor","Kedah","Kelantan","Melaka","Negeri Sembilan","Pahang","Perak","Perlis",
  "Pulau Pinang","Sabah","Sarawak","Selangor","Terengganu",
  "W.P. Kuala Lumpur","W.P. Labuan","W.P. Putrajaya"];

document.addEventListener("focusout", e => {
  if(e.target && e.target.id === "sv_sn2") e.target.value = normalizeSerial(e.target.value);
});

/* Sales channels (file 28). "direct" is the old name for End User. */
const CHANNELS = [
  { v:"end_user",   label:"End User",   cls:"g" },
  { v:"contractor", label:"Contractor", cls:"n" },
  { v:"dealer",     label:"Dealer",     cls:"n" },
  { v:"project",    label:"Project",    cls:"a" }
];
function channelInfo(ch){
  const v = ch === "direct" ? "end_user" : ch;
  return CHANNELS.find(c => c.v === v) || { v, label: v || "—", cls:"n" };
}
/* Same rule as normalize_serial() in the database: capitals, no spaces. */
function normalizeSerial(x){ return String(x || "").trim().replace(/\s+/g, "").toUpperCase(); }

/* Same rules as normalize_phone() in the database (file 26), so staff see the
   saved format as soon as they leave the box. The database has the final say. */
function normalizePhone(p){
  const raw = String(p || "").trim();
  let d = raw.replace(/\D/g, "");
  if(!d) return null;
  if(d.startsWith("0060")) d = "0" + d.slice(4);
  else if(d.startsWith("60") && d.length >= 10 && d.length <= 12) d = "0" + d.slice(2);
  else if(raw.startsWith("+")) return (d.length >= 8 && d.length <= 15) ? "+" + d : null;
  let m;
  if((m = d.match(/^(011)(\d{4})(\d{4})$/)))        return `${m[1]}-${m[2]} ${m[3]}`;
  if((m = d.match(/^(01[02-9])(\d{3})(\d{4})$/)))   return `${m[1]}-${m[2]} ${m[3]}`;
  if((m = d.match(/^(03)(\d{4})(\d{4})$/)))         return `${m[1]}-${m[2]} ${m[3]}`;
  if((m = d.match(/^(08[2-9])(\d{3})(\d{3})$/)))    return `${m[1]}-${m[2]} ${m[3]}`;
  if((m = d.match(/^(0[4-9])(\d{3})(\d{4})$/)))     return `${m[1]}-${m[2]} ${m[3]}`;
  return null;
}

/* Fire-and-forget. Never blocks the user, never breaks the app if it fails.
   Uses no-cors + text/plain so the browser sends it without a preflight
   check, which Apps Script does not answer. We cannot read the reply, and
   for a notification that is fine. */
function notify(event, payload){
  if (!NOTIFY_READY) {
    console.warn("MySolar: email notifications are switched off — NOTIFY_SECRET " +
                 "in index.html is still the example text.");
    return;
  }
  try {
    fetch(NOTIFY_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ event, secret: NOTIFY_SECRET }, payload))
    }).catch(() => {});
  } catch (e) { /* notifications must never break the app */ }
}

/* Supabase caps any single response at 1000 rows. With 3000 warranties the
   old code silently showed 1000 and no error. Fetch in pages instead, then
   cache — the registry was being re-downloaded on every keystroke. */
let LIST_CACHE = { rows: null, at: 0 };
const CACHE_MS = 60000;

/* One record, briefly cached. Saving a visit used to fetch the same record
   twice — once to return it, once when the page re-rendered. */
let REC_CACHE = { id: null, row: null, at: 0 };
const REC_MS = 20000;

const clearListCache = () => {
  LIST_CACHE = { rows: null, at: 0 };
  REC_CACHE  = { id: null, row: null, at: 0 };
};

const DataSource = {
  async _fetchAllInstallations(){
    const out = [], size = 1000;
    for (let from = 0; from < 100000; from += size) {
      const { data, error } = await sb.from("v_installations")
        .select("*").order("install_date", { ascending:false })
        .range(from, from + size - 1);
      if (error) throw error;
      out.push(...data);
      if (data.length < size) break;
    }
    return out;
  },

  /* Server-side search. The browser now receives only the page it shows,
     so load time stops depending on how many records exist. */
  async searchWarranties(filter, page, perPage){
    const { data, error } = await sb.rpc("search_installations", {
      p_query:   filter.q || "",
      p_status:  filter.status  || "all",
      p_channel: filter.channel || "all",
      p_faults:  filter.faults  || "all",
      p_pay:     filter.pay     || "all",
      p_limit:   perPage,
      p_offset:  page * perPage
    });
    if (error) throw error;

  },

  async registryStats(){
    const { data, error } = await sb.rpc("registry_stats");
    if (error) throw error;
    return data || {};
  },

  async listWarranties(force = false){
    if (!force && LIST_CACHE.rows && Date.now() - LIST_CACHE.at < CACHE_MS) {
      return LIST_CACHE.rows;
    }
    const rows = await this._fetchAllInstallations();
    const { data: open } = await sb.from("claims")
      .select("installation_id, raised_on, issue, status, resolution")
      .in("status", ["open","in_progress"]);
    const by = {};
    (open || []).forEach(c => { (by[c.installation_id] ||= []).push(c); });
    const mapped = rows.map(v => rowFromView(v, [], by[v.id] || []));
    LIST_CACHE = { rows: mapped, at: Date.now() };
    return mapped;
  },

  async getById(id, force = false){
    if (!force && REC_CACHE.row && String(REC_CACHE.id) === String(id)
        && Date.now() - REC_CACHE.at < REC_MS) {
      return REC_CACHE.row;
    }
    // All three in one go rather than the view first, then the rest.
    const [vRes, svcRes, clRes, mRes, fRes, eRes] = await Promise.all([
      sb.from("v_installations").select("*").eq("id", id).single(),
      sb.from("service_visits").select("*").eq("installation_id", id).order("visit_date"),
      sb.from("claims").select("*").eq("installation_id", id).order("raised_on"),
      sb.from("v_maintenance").select("*").eq("installation_id", id).order("sort_order"),
      sb.from("installations").select("has_filter,filter_install_date,voided_by,voided_at,project_name,guarantee_years_override,warranty_years_override,do_no,group_key,customer_id,lifting,crane_tons").eq("id", id).single(),
      sb.from("installation_edits").select("*").eq("installation_id", id).order("edited_at", { ascending: false })
    ]);
    if (vRes.error || !vRes.data) return null;
    /* An error on any of these used to be swallowed, so a permissions or
       network failure showed an empty service history on a unit with five
       visits — and staff would act on that as fact. */
    const sub = svcRes.error || clRes.error || mRes.error;
    if (sub) throw sub;
    const row = rowFromView(vRes.data, svcRes.data || [], clRes.data || []);
    row.maintenance = mRes.data || [];
    row.hasFilter   = fRes.data ? fRes.data.has_filter === true : false;
    row.filterDate  = fRes.data ? (fRes.data.filter_install_date || "") : "";
    row.voidedBy    = fRes.data ? (fRes.data.voided_by || "") : "";
    row.voidedAt    = fRes.data ? (fRes.data.voided_at || "") : "";
    row.voidedReason = vRes.data.voided_reason || "";
    row.projectName = fRes.data ? (fRes.data.project_name || "") : "";
    row.gOverride   = fRes.data ? fRes.data.guarantee_years_override : null;
    row.wOverride   = fRes.data ? fRes.data.warranty_years_override  : null;
    row.edits       = (eRes && !eRes.error && eRes.data) ? eRes.data : [];
    row.doNo        = fRes.data ? (fRes.data.do_no || "") : "";
    row.groupKey    = fRes.data ? (fRes.data.group_key || "") : "";
    row.lift        = fRes.data ? (fRes.data.lifting || "none") : "none";
    row.craneTons   = fRes.data ? fRes.data.crane_tons : null;
    /* The customer's other units: for "Units in this registration" and for
       choosing which unit a visit belongs to (file 33). */
    row.customerUnits = [];
    const custId = fRes.data ? fRes.data.customer_id : vRes.data.customer_id;
    if (custId != null) {
      const { data: units } = await sb.from("installations")
        .select("id,warranty_no,serial_no,model_code,group_key,voided,install_date")
        .eq("customer_id", custId).order("install_date").order("id");
      row.customerUnits = Array.isArray(units) ? units : [];
    }
    REC_CACHE = { id, row, at: Date.now() };
    return row;
  },

  async listActivity(f, page, perPage){
    let q = sb.from("activity_log").select("*", { count: "exact" })
      .order("at", { ascending: false }).order("id", { ascending: false })
      .range(page * perPage, page * perPage + perPage - 1);
    if (f.from) q = q.gte("at", f.from + "T00:00:00+08:00");
    if (f.to)   q = q.lt("at", nextDayISO(f.to) + "T00:00:00+08:00");
    if (f.actor === "system") q = q.is("actor", null);
    else if (f.actor) q = q.eq("actor", f.actor);
    if (f.kind === "deletions") q = q.eq("action", "record_deleted");
    else if (f.kind && ACTIVITY_KINDS[f.kind]) q = q.in("entity", ACTIVITY_KINDS[f.kind].tables);
    if (f.inst) q = f.cust ? q.or(`installation_id.eq.${Number(f.inst)},and(customer_id.eq.${Number(f.cust)},installation_id.is.null)`)
                           : q.eq("installation_id", Number(f.inst));
    if (f.q) q = q.ilike("ref", "%" + f.q.replace(/[%_\\]/g, m => "\\" + m) + "%");
    const { data, error, count } = await q;
    if (error) throw error;
    return { rows: data || [], total: count || 0 };

    if (error) return 0;
    return count || 0;
  },

  async generateFollowups(){
    const { data, error } = await sb.rpc("generate_followups");
    if (error) throw error;
    return data;
  },

  async completeFollowup(id, outcome, notes){
    const { error } = await sb.from("followups").update({
      status:"done", outcome, notes: notes || null,
      completed_at: new Date().toISOString()
    }).eq("id", id);
    if (error) throw error;
  },

  async snoozeFollowup(id, days){
    const d = new Date(); d.setDate(d.getDate() + days);
    const { error } = await sb.from("followups").update({
      status:"snoozed", snooze_until: todayISO(d)
    }).eq("id", id);
    if (error) throw error;
  },

  async signIn(email, password){
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return { ok:false, message:error.message };
    return { ok:true, user:data.user };
  },
  async signOut(){ await sb.auth.signOut(); },
  async currentUser(){ const { data } = await sb.auth.getUser(); return data.user || null; }
};

const $ = s => document.querySelector(s);
const digits = s => String(s||"").replace(/\D/g,"");
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function waNumber(phone){
  let d = digits(phone);
  if(d.startsWith("60")) return d;
  if(d.startsWith("0"))  return "6" + d;          // 012-345 6789 -> 60123456789
  return "60" + d;
}
function addYears(iso,n){ const d=new Date(iso+"T00:00:00"); d.setFullYear(d.getFullYear()+n); return d; }
function fmt(d){ const dt=(typeof d==="string")?new Date(d+"T00:00:00"):d;
  return dt.toLocaleDateString(LANG === "zh" ? "zh-CN" : "en-GB",
    {day:"2-digit",month:"short",year:"numeric"}); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

/* "4352d overdue" is arithmetically right and useless. Historical records
   will all look like this after data entry. */
function overdueText(days){
  const d = Number(days) || 0;
  if (d <= 0) return "";
  if (d < 60)  return d + "d overdue";
  if (d < 365) return Math.round(d/30) + " mths overdue";
  const y = Math.floor(d/365);
  return "overdue " + y + (y === 1 ? " yr+" : " yrs+");
}

/* models.pax holds "Up to 4" / "4 to 6" — English, from the database. Convert
   rather than translate, so adding a model later does not need a code change. */
function paxText(p){
  const v = String(p || "").trim();
  if(!v) return "—";
  if(LANG !== "zh") return v + " pax";
  const range = v.match(/(\d+)\s*to\s*(\d+)/i);
  if(range) return range[1] + "–" + range[2] + " 人";
  const upto = v.match(/up\s*to\s*(\d+)/i);
  if(upto) return "最多 " + upto[1] + " 人";
  return v;
}

function coverage(row){
  /* An unknown model code used to throw and take the whole registry page down
     with it. A model added to the database and not to this file is now shown
     with dashes rather than breaking the screen. */
  const m = MODELS[row.model] || {
    name: row.modelName || row.model || "—", litres:"—", gallons:"—", pax:"—",
    guaranteeYears:null, warrantyYears:null, steel:"—", tubes:"—", panel:"—"
  };
  const start = new Date(row.installDate+"T00:00:00");

  /* The end dates are STORED against each installation, on purpose, so that
     changing the standard terms never rewrites an old customer's warranty.
     Read them. Fall back to the model terms only when they are missing. */
  const gEnd = row.guaranteeEnd ? new Date(row.guaranteeEnd+"T00:00:00")
             : addYears(row.installDate, Number(m.guaranteeYears) || 0);
  const wEnd = row.warrantyEnd  ? new Date(row.warrantyEnd+"T00:00:00")
             : addYears(row.installDate, (Number(m.guaranteeYears) || 0) + (Number(m.warrantyYears) || 0));
  const now = new Date();
  let state,label,cls;
  if(row.voided){ state="voided"; label="Removed"; cls="n"; }
  else if(now<gEnd){ state="guarantee"; label="Under guarantee"; cls="g"; }
  else if(now<wEnd){ state="warranty"; label="Under warranty"; cls="w"; }
  else { state="expired"; label="Expired"; cls="x"; }
  const total = daysBetween(start,wEnd);
  const gone = Math.min(Math.max(daysBetween(start,now),0),total);
  return { state,label,cls,gEnd,wEnd,model:m,
    pctElapsed:Math.round(gone/total*100),
    pctGuarantee:Math.round(daysBetween(start,gEnd)/total*100),
    daysLeft:Math.max(daysBetween(now,wEnd),0) };
}

/* ---------- session security ----------
   Supabase keeps a session alive indefinitely by default: the refresh token
   renews itself forever. For a dashboard holding customer names, phone
   numbers and home addresses, sitting on an unattended office PC, that is
   not acceptable. Two limits:
     IDLE   — signed out after this long with no interaction
     MAX    — signed out this long after signing in, active or not
   Set the matching values in Supabase -> Authentication -> Sessions too,
   so the server enforces it as well as the browser. */
const IDLE_LIMIT_MIN   = 20;
const MAX_SESSION_HRS  = 12;
const WARN_BEFORE_MIN  = 2;

let lastActivity = Date.now();
let AUTH_MSG = "";
let guardTimer = null;

function sessionStart(){
  const v = localStorage.getItem("mysolar_session_start");
  return v ? Number(v) : null;
}
function setSessionStart(t){
  if (t) localStorage.setItem("mysolar_session_start", String(t));
  else   localStorage.removeItem("mysolar_session_start");
}

let lastMark = 0;
function lastActivityStored(){
  const v = localStorage.getItem("mysolar_last_activity");
  return v ? Number(v) : null;
}

/* Record "someone is here" in memory AND in localStorage (shared by every
   tab, and it survives the page being frozen or reloaded). */
function stamp(t){
  lastActivity = t; lastMark = t;
  try { localStorage.setItem("mysolar_last_activity", String(t)); } catch(e) {}
}
/* The most recent activity seen by any tab. */
function lastSeen(){
  return Math.max(lastActivity, lastActivityStored() || 0);
}

function markActivity(){
  const now = Date.now();
  if (now - lastMark < 5000) return;      // throttle
  /* THE FIX: if the machine was asleep, or Chrome froze this tab, the 20-second
     timer never got to run. The first mouse movement on return used to reset
     the idle clock and keep the session alive. If the limit has already
     passed, that movement must not revive it — sign out instead. */
  if (USER && now - lastSeen() > IDLE_LIMIT_MIN * 60e3) { checkSession(); return; }
  stamp(now);
  const w = document.getElementById("idleWarn");
  if (w) w.remove();
}
/* pointerdown and touchstart cover phones and tablets; mousemove and keydown
   cover computers. */
["pointerdown","click","keydown","mousemove","touchstart","scroll"].forEach(ev =>
  window.addEventListener(ev, markActivity, { passive: true, capture: true }));
/* Returning to the tab, waking the computer, restoring from back/forward cache */
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkSession(); });
window.addEventListener("focus",    () => checkSession());
window.addEventListener("pageshow", () => checkSession());

/* If another tab signs out, this one must follow immediately. */
sb.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_OUT" && USER) {
    USER = null; FU_COUNT = 0; IS_ADMIN = false; setSessionStart(null);
    setTimeout(() => { location.hash = "#/admin"; render(); }, 0);
  }
});

/* Remove the stored login token from this browser directly. Used as well as
   the normal sign-out, because a phone coming back with no signal cannot
   reach the server to sign out — the token must still be gone. */
function wipeLocalSession(){
  try {
    Object.keys(localStorage)
      .filter(k => k.startsWith("sb-") && k.includes("auth-token"))
      .forEach(k => localStorage.removeItem(k));
  } catch(e) {}
}

async function forceSignOut(msg){
  /* Clear the screen FIRST. Customer data must not stay visible while a
     network call to sign out is in progress — or fails because the phone
     has no signal. */
  AUTH_MSG = msg;
  USER = null; FU_COUNT = 0; IS_ADMIN = false;
  setSessionStart(null);
  try { localStorage.removeItem("mysolar_last_activity"); } catch(e) {}
  if (guardTimer) { clearInterval(guardTimer); guardTimer = null; }
  const w = document.getElementById("idleWarn"); if (w) w.remove();
  location.hash = "#/admin";
  render();
  /* "local" signs out this device only, so a timeout on the office PC does
     not also sign the same person out of their phone. */
  /* Recorded in the activity log while the sign-in is still valid. Capped at
     2 seconds so a phone with no signal is not held up. */
  await Promise.race([DataSource.logEvent("timed_out"), new Promise(r => setTimeout(r, 2000))]);
  try { await sb.auth.signOut({ scope: "local" }); } catch(e) {}
  wipeLocalSession();
}

function showIdleWarning(secsLeft){
  if (document.getElementById("idleWarn")) return;
  const d = document.createElement("div");
  d.id = "idleWarn";
  d.className = "idlewarn";
  d.innerHTML = `Signing you out in about ${Math.ceil(secsLeft/60)} minute(s) for security.
    <button class="btn btn-s" style="padding:7px 14px;font-size:.86rem;margin-left:10px">${t("Stay signed in")}</button>`;
  d.querySelector("button").onclick = () => {
    stamp(Date.now());
    d.remove();
  };
  document.body.appendChild(d);
}

async function checkSession(){
  if (!USER) return;
  const now = Date.now();

  /* No start stamp (storage cleared) must not mean "no 12-hour limit". */
  if (!sessionStart()) setSessionStart(now);
  const started = sessionStart();
  if (now - started > MAX_SESSION_HRS * 3600e3) {
    return forceSignOut(`Signed out after ${MAX_SESSION_HRS} hours. Please sign in again.`);
  }

  const idleMs = now - lastSeen();
  if (idleMs > IDLE_LIMIT_MIN * 60e3) {
    return forceSignOut(`Signed out after ${IDLE_LIMIT_MIN} minutes of inactivity.`);
  }
  const leftMs = IDLE_LIMIT_MIN * 60e3 - idleMs;
  if (leftMs < WARN_BEFORE_MIN * 60e3) showIdleWarning(leftMs / 1000);
}

function startSessionGuard(){
  if (guardTimer) clearInterval(guardTimer);
  guardTimer = setInterval(checkSession, 20000);
}

    errBox.innerHTML = `<div class="err">${t("Please fill in both the warranty number and the phone number.")}</div>`; return;
  }
  btn.disabled = true; btn.textContent = t("Checking…");
  try{
    const res = await DataSource.findForCustomer($("#wn").value, $("#pn").value);
    if(!res.ok){
      /* The database deliberately does not say WHICH of the two was wrong —
         that would let someone test warranty numbers one at a time. So the
         message has to name both, or customers re-check the number forever
         when it was the phone number that did not match. */
      errBox.innerHTML = `<div class="err">${t("No record matches that warranty number and phone number together. Please check both — the phone number must be the one given when the system was installed.")}</div>`;

      box.innerHTML = customerCard(res.row);

         public page, which the privacy notice does not mention and which no
         visitor has agreed to. The same sales signal is already in the
         warranty-ending reminder the office gets from the database, so
         nothing is lost by not doing it here. */

    errBox.innerHTML = `<div class="err">${t("Couldn't reach the server. Please try again.")}<br><span class="tiny mono">${esc(e.message||e)}</span></div>`;

/* Postcode: digits only, at most `max`. The box is only rewritten when
   something other than a digit was typed, and the cursor stays where it was.
   (Rewriting it on every key sent the cursor to the end of the box.) */
function keepDigits(el, max){
  el.addEventListener("input", () => {
    const v = el.value, clean = v.replace(/\D/g, "").slice(0, max);
    if(clean === v) return;
    const at = el.selectionStart ?? v.length;
    const before = v.slice(0, at).replace(/\D/g, "").length;
    el.value = clean;
    const p = Math.min(before, clean.length);
    try { el.setSelectionRange(p, p); } catch(e) {}
  });
}

/* ---------- maintenance schedule ---------- */
/* Plain language on purpose. "Overdue by 40 days" is read faster than a date
   the reader has to compare against today in their head. */
function maintLabel(m){
  const raw = (LANG === "zh" && m.label_zh) ? m.label_zh : m.label;
  return String(raw).replace(/ due$/i, "");
}

function maintStatus(m){
  if(!m.active)                 return { cls:"n", text:t("Not applicable") };
  const over = Number(m.days_overdue), until = Number(m.days_until);
  if(over > 0)                  return { cls:"x", text:`${t("Overdue by")} ${over} ${t("days")}` };
  if(over === 0)                return { cls:"x", text:t("Due today") };
  if(m.state === "soon")        return { cls:"a", text:`${t("Due in")} ${until} ${t("days")}` };
  return { cls:"n", text:fmt(m.next_due_date) };
}

/* "Price charged" as staff read it on a service call: the amount, and what
   is still owed when it is not settled. */
function priceText(s){
  if(!s.chargeable) return t("No charge");
  const amt = Number(s.amount);
  const money = v => "RM " + Number(v).toLocaleString("en-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if(s.amount == null || s.amount === "" || isNaN(amt)) return t("Chargeable — amount not entered");
  if(s.payStatus === "partial" && s.amountPaid != null && !isNaN(Number(s.amountPaid)))
    return `${money(amt)} · ${t("paid")} ${money(s.amountPaid)}${s.paidOn ? " (" + fmt(s.paidOn) + ")" : ""} · ${t("owed")} ${money(Math.max(amt - Number(s.amountPaid), 0))}`;
  if(s.payStatus === "paid" && s.paidOn) return `${money(amt)} · ${t("paid on")} ${fmt(s.paidOn)}`;
  return money(amt);
}

/* The tank currently fitted, if it was ever replaced: the most recent visit
   (not removed) that recorded a replacement S/N. */
function latestSecondary(r){
  const list = (r.service || []).filter(s => !s.voided && s.secondary);
  if(!list.length) return null;
  return list.slice().sort((a,b) => String(a.date).localeCompare(String(b.date))).pop();
}

/* Crane / skylift (file 34). prefix = "n" (register), "e" (edit), "sv" (visit). */
function liftFields(prefix, lift = "none", tons = null){
  const L = lift || "none";
  return `<div class="row2">
    <div class="field"><label for="${prefix}_lift">${t("Crane or skylift needed?")}</label>
      <select id="${prefix}_lift" data-lift="${prefix}">
        <option value="none"${L === "none" ? " selected" : ""}>${t("Not needed")}</option>
        <option value="skylift"${L === "skylift" ? " selected" : ""}>${t("Skylift")}</option>
        <option value="crane"${L === "crane" ? " selected" : ""}>${t("Crane")}</option></select></div>
    <div class="field" id="${prefix}_tonsrow" style="visibility:${L === "crane" ? "visible" : "hidden"}">
      <label for="${prefix}_tons">${t("Crane lifting capacity (tons)")}</label>
      <input id="${prefix}_tons" type="number" min="0.5" max="500" step="0.5" value="${tons != null ? esc(tons) : ""}"></div>
  </div>`;
}
function syncLift(prefix){
  const sel = document.getElementById(prefix + "_lift"), row = document.getElementById(prefix + "_tonsrow");
  if(sel && row) row.style.visibility = sel.value === "crane" ? "visible" : "hidden";
}
document.addEventListener("change", e => { if(e.target && e.target.dataset && e.target.dataset.lift) syncLift(e.target.dataset.lift); });
/* Returns { lift, tons } or { error }. */
function readLift(prefix){
  const sel = document.getElementById(prefix + "_lift");
  if(!sel) return { lift: null, tons: null };
  if(sel.value !== "crane") return { lift: sel.value, tons: null };
  const v = Number(document.getElementById(prefix + "_tons").value);
  if(!v || v <= 0 || v > 500) return { error: t("Please enter the crane lifting capacity in tons (more than 0, up to 500).") };
  return { lift: "crane", tons: v };
}
function liftText(lift, tons){
  if(lift === "skylift") return t("Skylift");
  if(lift === "crane") return `${t("Crane")}${tons != null ? ` — ${Number(tons)} ${t("tons")}` : ""}`;
  return "";
}

/* Names in Title Case, as the database stores them (file 34):
   first letter of every word in capitals, the rest small. */
function titleCase(s){
  return String(s || "").trim().replace(/\s+/g, " ").toLowerCase()
    .replace(/(^|[^\p{L}\p{N}])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
}
document.addEventListener("focusout", e => {
  if(e.target && ["n_name","e_name","n_dealer","e_dealer"].includes(e.target.id) && !e.target.readOnly)
    e.target.value = titleCase(e.target.value);
});

/* A replacement tank has its own warranty from the visit date (file 31). */
function tankWarranty(s, withPill = true){
  if(!s || !s.secondary || !s.secondaryEnd) return "";
  const over = new Date(s.secondaryEnd + "T00:00:00") <= new Date();
  return `${t("warranty until")} ${fmt(s.secondaryEnd)}` + (withPill
    ? ` <span class="pill ${over ? "x" : "g"}">${over ? t("Expired") : t("Under warranty")}</span>` : "");
}

/* "(1 + 9 yr)": the warranty starts when the guarantee ends (file 31). */
function warrantyTerm(m){
  const g = Number(m.guaranteeYears), w = Number(m.warrantyYears);
  if(!w && !g) return "";
  return g > 0 ? ` (${g} + ${w} ${t("yr")})` : ` (${w} ${t("yr")})`;
}

/* One unit's history on paper, for the technician to take on the next call.
   Removed visits are left off. Prints only this record. */
function printHistory(r){
  if(!r) return;
  const c = coverage(r);
  const sec = latestSecondary(r);
  const visits = (r.service || []).filter(s => !s.voided).slice().reverse();
  const maint = (r.maintenance || []).filter(m => m.active !== false);
  const kv = (k, v) => v ? `<tr><th>${esc(k)}</th><td>${v}</td></tr>` : "";
  const html = `
    <div class="ph">
      <div class="ph-top"><b>MySolar — ${esc(t("Service history"))}</b>
        <span>${esc(t("Printed"))} ${fmt(todayISO())}${USER?.email ? " · " + esc(USER.email) : ""}</span></div>
      <table class="ph-kv">
        ${kv(t("Warranty no"), esc(r.warrantyNo))}
        ${kv(t("Model"), esc((c.model.brand ? c.model.brand + " · " : "") + c.model.name))}
        ${kv(t("Serial number"), esc(r.serial || "—"))}
        ${sec ? kv(t("Replacement tank S/N"), esc(sec.secondary) + " (" + fmt(sec.date) + ")" + (sec.secondaryEnd ? " — " + tankWarranty(sec, false) : "")) : ""}
        ${kv(t("Installed"), fmt(r.installDate))}
        ${r.doNo ? kv(t("DO No."), esc(r.doNo)) : ""}
        ${liftText(r.lift, r.craneTons) ? kv(t("Crane / skylift"), esc(liftText(r.lift, r.craneTons))) : ""}
        ${c.model.guaranteeYears === 0 ? "" : kv(t("Guarantee ends"), fmt(c.gEnd))}
        ${kv(t("Warranty ends"), fmt(c.wEnd))}
        ${kv(t("Customer"), esc(r.name))}
        ${kv(t("Phone"), esc(r.phone))}
        ${kv(t("Installation address"), esc(r.address || "—"))}
      </table>
      ${maint.length ? `<h4>${esc(t("Maintenance schedule"))}</h4>
        <table class="ph-t"><thead><tr><th>${esc(t("Task"))}</th><th>${esc(t("Next due"))}</th><th>${esc(t("Last done"))}</th></tr></thead><tbody>
        ${maint.map(m => `<tr><td>${esc(LANG === "zh" && m.label_zh ? m.label_zh : String(m.label || "").replace(/ due$/i,""))}</td>
          <td>${m.next_due_date ? fmt(m.next_due_date) : "—"}</td><td>${m.last_done_date ? fmt(m.last_done_date) : "—"}</td></tr>`).join("")}
        </tbody></table>` : ""}
      <h4>${esc(t("Service history"))} (${visits.length})</h4>
      ${visits.length ? `<table class="ph-t"><thead><tr>
          <th>${esc(t("Date"))}</th><th>${esc(t("Type"))}</th><th>${esc(t("Team"))}</th>
          <th>${esc(t("Parts replaced"))}</th><th>${esc(t("Price charged"))}</th><th>${esc(t("Notes"))}</th></tr></thead><tbody>
        ${visits.map(s => `<tr><td>${fmt(s.date)}</td><td>${esc(s.type)}${s.fault ? " (" + esc(t("Fault")) + ")" : ""}</td>
          <td>${esc(s.tech || "—")}</td>
          <td>${esc(s.parts || "—")}${s.secondary ? "<br>" + esc(t("Replacement tank S/N")) + ": " + esc(s.secondary) + (s.secondaryEnd ? "<br>" + tankWarranty(s, false) : "") : ""}</td>
          <td>${priceText(s)}${s.invoiceNo ? "<br>" + esc(t("Invoice No.")) + ": " + esc(s.invoiceNo) : ""}</td>
          <td>${esc(s.note || "")}${s.formNo ? "<br>" + esc(t("Service Form No.")) + ": " + esc(s.formNo) : ""}${
            liftText(s.lift, s.craneTons) ? "<br>" + esc(t("Crane / skylift")) + ": " + esc(liftText(s.lift, s.craneTons)) : ""}</td></tr>`).join("")}
        </tbody></table>` : `<p>${esc(t("No service visits recorded."))}</p>`}
      <p class="ph-foot">${esc(t("Internal record — contains customer personal data. Do not leave it with anyone outside MySolar."))}</p>
    </div>`;
  let box = document.getElementById("printArea");
  if(!box){ box = document.createElement("div"); box.id = "printArea"; document.body.appendChild(box); }
  box.innerHTML = html;
  document.body.classList.add("printing");
  const done = () => { document.body.classList.remove("printing"); box.innerHTML = ""; window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  window.print();
}

async function viewDetail(id){
  const r = await DataSource.getById(id);
  CURRENT_RECORD = r;
  if(!r) return `<div class="page"><div class="card empty">${t("Record not found.")}</div></div>`;
  const c = coverage(r);
  /* A Project's own terms replace the product's on this record. */
  if(r.gOverride != null && r.wOverride != null)
    c.model = Object.assign({}, c.model, { guaranteeYears: r.gOverride, warrantyYears: r.wOverride });
  const faults = faultVisitsInWindow(r.service);
  const repeatFlag = faults.length >= REPEAT_THRESHOLD;

  const svc = r.service.length ? r.service.slice().reverse().map(s => `
    <div class="claim${s.voided ? " voided" : ""}" data-visit="${s.id}">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
      <b>${esc(s.type)}</b>
      <span style="display:flex;gap:6px;align-items:center">
        ${s.voided ? `<span class="pill n">${t("Removed")}</span>` : ""}
        ${s.fault && !s.voided ? `<span class="pill x">${t("Fault")}</span>` : ''}
        ${s.chargeable ? `<span class="pill ${
            s.payStatus === "paid" ? "g" :
            (s.dueOn && new Date(s.dueOn+"T00:00:00") < new Date()) ? "x" : "a"
          }">${
            s.payStatus === "paid" ? t("paid") :
            s.payStatus === "partial" ? t("part paid") : t("unpaid")}</span>` : ''}
        <span class="src">${fmt(s.date)}</span></span></div>
      <dl class="svc-kv">
        <dt>${t("Team")}</dt><dd>${esc(s.tech || "—")}</dd>
        <dt>${t("Parts replaced")}</dt><dd>${esc(s.parts || "—")}</dd>
        <dt>${t("Price charged")}</dt><dd>${priceText(s)}</dd>
        ${s.formNo ? `<dt>${t("Service Form No.")}</dt><dd class="mono">${esc(s.formNo)}</dd>` : ""}
        ${s.invoiceNo ? `<dt>${t("Invoice No.")}</dt><dd class="mono">${esc(s.invoiceNo)}</dd>` : ""}

/* ---------- edit an existing record (file 29) ---------- */
function productOptions(selected){
  const groups = {};
  Object.entries(MODELS)
    .filter(([k,m]) => m.active !== false || k === selected)
    .sort((a,b) => (a[1].sortOrder ?? 999) - (b[1].sortOrder ?? 999) || a[0].localeCompare(b[0]))
    .forEach(([k,m]) => { (groups[m.category || ""] = groups[m.category || ""] || []).push([k,m]); });
  const termText = m => (Number(m.guaranteeYears) > 0
      ? `${m.guaranteeYears} ${t("yr")} ${t("Guarantee")} + ${m.warrantyYears} ${t("yr")} ${t("Warranty")}`
      : `${m.warrantyYears} ${t("yr")} ${t("Warranty")}`);
  const optLine = ([k,m]) =>
    `<option value="${esc(k)}"${k === selected ? " selected" : ""}>${esc((m.brand ? m.brand + " · " : "") + m.name)} — ${esc(termText(m))}</option>`;
  return Object.entries(groups).map(([cat, list]) => cat
      ? `<optgroup label="${esc(cat)}">${list.map(optLine).join("")}</optgroup>`
      : list.map(optLine).join("")).join("");
}

    $("#e_dealerrow").style.visibility = (v === "dealer" || v === "contractor") ? "visible" : "hidden";
    $("#e_dealerlbl").textContent = v === "contractor" ? t("Contractor name") : t("Dealer name");
    if(v === "project") fillTerms();
    $("#e_projrow").style.display = v === "project" ? "" : "none";
  };
  ch.onchange = sync; sync();
  const ph = $("#e_phone");
  ph.addEventListener("blur", () => { const f = normalizePhone(ph.value); if(f) ph.value = f; });
  const sn = $("#e_serial");
  sn.addEventListener("blur", () => { sn.value = normalizeSerial(sn.value); });
  const pc = $("#e_postcode");
  keepDigits(pc, 5);
  $("#eCancel").onclick = () => { location.hash = "#/admin/" + id; };
  $("#eSave").onclick = async () => {
    const v = k => $("#"+k).value.trim();
    const err = m => { showMsg("eErr", `<div class="err">${esc(m)}</div>`); };
    if(!v("e_name") || !v("e_phone") || !v("e_date")) return err(t("Name, phone and install date are required."));
    if(!normalizePhone(v("e_phone"))) return err(t("Please enter a valid phone number, for example 012-345 6789. For a number outside Malaysia, start with +"));
    if(v("e_postcode") && !/^\d{5}$/.test(v("e_postcode"))) return err(t("Postcode must be 5 digits."));
    const chv = ch.value, gy = v("e_gy"), wy = v("e_wy");
    if(chv === "project" && (gy === "" || wy === "" || +gy < 0 || +gy > 30 || +wy < 0 || +wy > 30))
      return err(t("For a Project, enter the guarantee and warranty years (0 to 30)."));
    const lf = readLift("e");
    if(lf.error) return err(lf.error);
    const b = $("#eSave"); b.disabled = true; b.textContent = t("Saving…");
    try{
      await DataSource.updateDetails(id, {
        name: v("e_name"), phone: normalizePhone(v("e_phone")), email: v("e_email"), doNo: v("e_do"),
        address1: v("e_addr1"), address2: v("e_addr2"), postcode: v("e_postcode"),
        area: v("e_area"), state: $("#e_state").value,
        model: mdl.value, serial: normalizeSerial(v("e_serial")), installDate: v("e_date"),
        channel: chv, dealer: (chv === "dealer" || chv === "contractor") ? v("e_dealer") : "",
        installer: v("e_installer"), lift: lf.lift, craneTons: lf.tons,
        projectName: chv === "project" ? v("e_proj") : "",
        guaranteeYears: chv === "project" ? Number(gy) : null,
        warrantyYears:  chv === "project" ? Number(wy) : null });
      location.hash = "#/admin/" + id;
    }catch(e){
      err(e.message || String(e));
      b.disabled = false; b.textContent = t("Save changes");
    }
  };
}

function wireSettings(){
  const adminMsg = (html) => { const m = $("#setMsg"); if(m) m.innerHTML = html; };
  const addA = $("#addAdmin");
  if(addA) addA.onclick = async () => {
    const em = ($("#newAdmin").value || "").trim();
    if(!em) return;
    try { await DataSource.setAdmin(em, true); await refreshAdmin(); render(); }
    catch(e){ adminMsg(`<div class="err">${esc(e.message || e)}</div>`); }
  };
  document.querySelectorAll("[data-admin] [data-unadmin]").forEach(b => b.onclick = async () => {
    const em = b.closest("[data-admin]").dataset.admin;
    if(!confirm(t("Remove admin rights from") + " " + em + "?")) return;
    try { await DataSource.setAdmin(em, false); await refreshAdmin(); render(); }
    catch(e){ adminMsg(`<div class="err">${esc(e.message || e)}</div>`); }
  });
  const msg = (html) => { $("#setMsg").innerHTML = html;
    setTimeout(() => { const m = $("#setMsg"); if(m) m.innerHTML = ""; }, 4000); };

  document.querySelectorAll("#ruleBody tr[data-rule]").forEach(tr => {
    tr.querySelector("[data-save]").onclick = async (e) => {
      const b = e.target; b.disabled = true; b.textContent = "…";
      try {
        await DataSource.saveRule(
          tr.dataset.rule,
          tr.querySelector("[data-active]").checked,
          tr.querySelector("[data-offset]").value,
          tr.querySelector("[data-window]") ? tr.querySelector("[data-window]").value : null
        );
        msg(`<div class="ok">${t("Saved.")}</div>`);
      } catch(err){ msg(`<div class="err">${esc(err.message || err)}</div>`); }
      b.disabled = false; b.textContent = "Save";
    };
  });

  document.querySelectorAll("#taskBody tr[data-task]").forEach(tr => {
    tr.querySelector("[data-savetask]").onclick = async (e) => {
      const b = e.target; b.disabled = true; b.textContent = "…";
      try {
        await DataSource.saveMaintenanceTask(
          tr.dataset.task,
          tr.querySelector("[data-months]").value,
          tr.querySelector("[data-recurring]").checked,
          tr.querySelector("[data-advance]").value,
          tr.querySelector("[data-taskactive]").checked
        );
        msg(`<div class="ok">${t("Saved.")}</div>`);
      } catch(err){ msg(`<div class="err">${esc(err.message || err)}</div>`); }
      b.disabled = false; b.textContent = t("Save");
    };
  });

  document.querySelectorAll("#setBody tr[data-setting]").forEach(tr => {
    tr.querySelector("[data-savesetting]").onclick = async (e) => {
      const b = e.target; b.disabled = true; b.textContent = "…";
      try {
        await DataSource.saveSetting(tr.dataset.setting, tr.querySelector("[data-val]").value);
        msg(`<div class="ok">${t("Saved.")}</div>`);
      } catch(err){ msg(`<div class="err">${esc(err.message || err)}</div>`); }
      b.disabled = false; b.textContent = "Save";
    };
  });
}

async function viewFollowups(){
  const rows = await DataSource.listFollowups();
  const shown = FU_FILTER === "all" ? rows : rows.filter(r => r.rule_code === FU_FILTER);

  const counts = {
    all: rows.length,
    high: rows.filter(r => r.priority === "high").length,
    overdue: rows.filter(r => r.days_overdue > 0).length
  };

  const body = shown.length ? shown.map(r => {
    const tpl = WA_TEMPLATES[r.rule_code] || (x => `Hi ${x.customer_name}, this is MySolar.`);
    const wa = `https://wa.me/${waNumber(r.customer_phone)}?text=${encodeURIComponent(tpl(r))}`;
    return `
    <div class="fu" data-fu="${r.id}">
      <div class="fu-main">
        <div>
          <span class="pill ${r.priority==="high"?"x":r.priority==="normal"?"w":"n"}">${
            esc(LANG === "zh" && r.label_zh ? r.label_zh : t(r.label))}</span>
          ${r.days_overdue > 0 ? `<span class="pill a">${overdueText(r.days_overdue)}</span>` : ""}
          ${r.rule_code === "repeat_visits" && r.fault_visits_12m
              ? `<span class="pill x">${r.fault_visits_12m} repairs / 12mth</span>` : ""}
          <div class="fu-name">${esc(r.customer_name)}</div>
          <div class="src">${esc(r.customer_phone)} · ${esc(r.customer_area||"—")} · ${esc(r.warranty_no)} · ${esc(r.model_name.replace("MySolar ",""))}</div>
        </div>
        <div class="fu-acts">
          <a class="btn btn-p" style="padding:9px 14px;font-size:.87rem" target="_blank" rel="noopener" href="${wa}">WhatsApp</a>
          <button class="btn btn-s" style="padding:9px 14px;font-size:.87rem" data-act="done">${t("Done")}</button>
          <button class="btn btn-s" style="padding:9px 14px;font-size:.87rem" data-act="snooze">${t("Snooze")}</button>
          <button class="btn btn-s" style="padding:9px 14px;font-size:.87rem" data-act="open">${t("Record")}</button>
        </div>
      </div>
      <div class="fu-panel" data-panel="done">
        <label>${t("What happened?")}</label>
        <div class="fu-opts">${OUTCOMES.map(([v,l]) =>
          `<button class="btn btn-s" style="padding:8px 13px;font-size:.86rem" data-outcome="${v}">${t(l)}</button>`).join("")}</div>
        <input data-note placeholder="Note (optional)" style="margin-top:10px">
      </div>
      <div class="fu-panel" data-panel="snooze">
        <label>${t("Remind me again in")}</label>
        <div class="fu-opts">
          <button class="btn btn-s" style="padding:8px 13px;font-size:.86rem" data-snooze="7">${t("1 week")}</button>
          <button class="btn btn-s" style="padding:8px 13px;font-size:.86rem" data-snooze="30">${t("1 month")}</button>
          <button class="btn btn-s" style="padding:8px 13px;font-size:.86rem" data-snooze="90">${t("3 months")}</button>
        </div>
      </div>
    </div>`;
  }).join("") : `<div class="card empty">${counts.all === 0
      ? `${t("Nothing due right now.")}<br><span class="tiny">${
            t("Press")} “${t("Refresh list")}” ${t("to check for newly due follow-ups.")}</span>`
      : "No follow-ups match that filter."}</div>`;

  return `<div class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px">
      <h1>${t("Follow-ups")}</h1>
      <button class="btn btn-s" id="fuGen">${t("Refresh list")}</button>
    </div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><b>${counts.all}</b><span>${t("To follow up")}</span></div>
      <div class="stat"><b style="color:var(--red)">${counts.high}</b><span>${t("Priority")}</span></div>

    </div>
    <div class="tabs">${FU_TABS.map(([k,label]) => {

      return `<button class="tab ${FU_FILTER===k?"on":""}" data-tab="${k}">${t(label)}${
        n ? ` <span class="tabn">${n}</span>` : ""}</button>`;

function wireFollowups(){
  const gen = $("#fuGen");
  if(gen) gen.onclick = async () => {
    gen.disabled = true; gen.textContent = "Checking…";
    try { await DataSource.generateFollowups(); } catch(e){ alert(e.message || e); }
    render();
  };
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    FU_FILTER = b.dataset.tab; render();
  });

  document.querySelectorAll(".fu").forEach(card => {
    const id = card.dataset.fu;
    const panels = { done: card.querySelector('[data-panel="done"]'),
                     snooze: card.querySelector('[data-panel="snooze"]') };

    card.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      const target = (a === "open") ? "done" : a;
      if(a === "open" || a === "done" || a === "snooze"){
        const isOpen = panels[target].classList.contains("show");
        Object.values(panels).forEach(p => p.classList.remove("show"));
        if(!isOpen) panels[target].classList.add("show");
      }
    });

    card.querySelectorAll("[data-outcome]").forEach(b => b.onclick = async () => {
      const note = card.querySelector("[data-note]").value.trim();
      const outcome = b.dataset.outcome;
      b.disabled = true;
      try {
        await DataSource.completeFollowup(id, outcome, note);
        if (outcome === "sold" || outcome === "booked") {
          notify("followup_won", {
            customer_name: card.querySelector(".fu-name").textContent.trim(),
            label:   card.querySelector(".pill").textContent.trim(),
            outcome: (OUTCOMES.find(o => o[0] === outcome) || [,outcome])[1],
            notes:   note,
            staff:   USER?.email || "staff"
          });
        }
        render();
      }
      catch(e){ alert(e.message || e); b.disabled = false; }
    });

    card.querySelectorAll("[data-snooze]").forEach(b => b.onclick = async () => {
      b.disabled = true;
      try { await DataSource.snoozeFollowup(id, Number(b.dataset.snooze)); render(); }
      catch(e){ alert(e.message || e); b.disabled = false; }
    });
  });
}

/* A pop-up, not just the red banner, so nobody books a job for a
   blacklisted customer without seeing it. Shown once each time the record
   is opened — not again every time the page refreshes after a save. */

function showMsg(id, html){
  const el = document.getElementById(id);

}

/* The duplicate warning as a pop-up, so it cannot be missed. */
function duplicatePopup(innerHtml, onProceed){
  const old = document.getElementById("dupPop"); if(old) old.remove();
  const d = document.createElement("div");
  d.id = "dupPop";
  d.setAttribute("role", "alertdialog");
  d.setAttribute("aria-modal", "true");
  d.style.cssText = "position:fixed;inset:0;z-index:300;background:rgba(10,43,56,.55);display:flex;align-items:center;justify-content:center;padding:16px";
  d.innerHTML = `<div class="card" style="max-width:520px;width:100%;max-height:90vh;overflow:auto;border-top:6px solid var(--amber)">
      <div class="card-pad">${innerHtml}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
          <button class="btn btn-s" id="dupBack" style="flex:1">${t("Go back and check")}</button>
          <button class="btn btn-p" id="dupGo" style="flex:1">${t("Register anyway")}</button></div>
      </div></div>`;
  document.body.appendChild(d);
  const close = () => { d.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if(e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  d.querySelector("#dupBack").onclick = close;
  d.querySelector("#dupGo").onclick = () => { close(); onProceed(); };
  d.querySelector("#dupBack").focus();
}

/* Permanent delete (file 31). Admin only, removed records only, and the
   warranty number must be typed — the database checks all three again. */
function deletePopup(r){
  if(!r) return;
  const old = document.getElementById("delPop"); if(old) old.remove();
  const d = document.createElement("div");
  d.id = "delPop";
  d.setAttribute("role", "alertdialog");
  d.setAttribute("aria-modal", "true");
  d.setAttribute("aria-labelledby", "delPopT");
  d.style.cssText = "position:fixed;inset:0;z-index:300;background:rgba(10,43,56,.55);display:flex;align-items:center;justify-content:center;padding:16px";
  d.innerHTML = `<div class="card" style="max-width:480px;width:100%;max-height:90vh;overflow:auto;border-top:6px solid var(--red)">
      <div class="card-pad">
        <h3 id="delPopT" style="color:var(--red);margin-bottom:8px">${t("Delete this record permanently?")}</h3>
        <p style="margin:0">${t("This deletes the unit, its service history, reminders, maintenance schedule and change history. If it is the customer's only unit, the customer's details are deleted too.")}</p>
        <p style="margin:8px 0 0"><b>${t("This cannot be undone.")}</b></p>
        <div class="field" style="margin-top:14px"><label for="delNo">${t("Type the warranty number to confirm")}: <span class="mono">${esc(r.warrantyNo)}</span></label>
          <input id="delNo" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="delWhy">${t("Reason")}</label>
          <input id="delWhy" placeholder="${t("e.g. Customer asked for their data to be deleted")}"></div>
        <div id="delErr"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
          <button class="btn btn-s" id="delBack" style="flex:1">${t("Cancel")}</button>
          <button class="btn btn-p" id="delGo" style="flex:1;background:var(--red);border-color:var(--red)" disabled>${t("Delete permanently")}</button></div>
      </div></div>`;
  document.body.appendChild(d);
  const close = () => { d.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if(e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  const no = d.querySelector("#delNo"), why = d.querySelector("#delWhy"), go = d.querySelector("#delGo");
  const check = () => { go.disabled = !(no.value.trim().toUpperCase() === String(r.warrantyNo).toUpperCase() && why.value.trim().length >= 3); };
  no.addEventListener("input", check); why.addEventListener("input", check);
  d.querySelector("#delBack").onclick = close;
  go.onclick = async () => {
    go.disabled = true; go.textContent = t("Deleting…");
    try{
      await DataSource.deleteInstallationPermanently(r.id, no.value.trim(), why.value.trim());
      close();
      FLASH = `${t("Deleted permanently")}: ${r.warrantyNo}`;
      location.hash = "#/admin/list";
    }catch(e){
      d.querySelector("#delErr").innerHTML = `<div class="err">${esc(e.message || e)}</div>`;
      go.textContent = t("Delete permanently"); check();
    }
  };
  no.focus();
}

const FIELD_HIDDEN = new Set(["voided_at","voided_by","completed_at","completed_by","blacklisted_at","added_at","added_by",
  "entry_mode","warranty_no","customer_id","installation_id","consent_notice_ver","rule_code","task_code","code","key","priority",

function actValue(k, v){
  if(v === null || v === undefined || v === "") return "—";
  if(typeof v === "boolean") return v ? t("Yes") : t("No");
  if(k === "model_code" && MODELS[v]) return esc(MODELS[v].name);
  if(k === "channel") return esc(t(channelInfo(v).label));
  if(typeof v === "string" && /^\d{4}-\d{2}-\d{2}T/.test(v)) return fmt(new Date(v));
  if(typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v)) return fmt(v);
  const s = String(v);
  return esc(s.length > 90 ? s.slice(0, 90) + "…" : s);
}

function actDetails(row){
  if(row.changes === null && row.entity !== "session")
    return `<span class="tiny muted">${t("Details wiped when the record was deleted")}</span>`;
  if(row.entity === "admins") return "";            // the email is already shown under "What"
  const ch = row.changes || {};
  const keys = Object.keys(ch).filter(k => !FIELD_HIDDEN.has(k));
  if(!keys.length) return "";
  const line = k => {
    const [o, n] = Array.isArray(ch[k]) ? ch[k] : [null, ch[k]];
    const label = esc(t(FIELD_LABELS[k] || k));
    return (o === null || o === undefined)
      ? `<div><span class="muted">${label}:</span> ${actValue(k, n)}</div>`
      : `<div><span class="muted">${label}:</span> ${actValue(k, o)} &rarr; <b>${actValue(k, n)}</b></div>`;
  };
  if(keys.length <= 3) return `<div class="tiny">${keys.map(line).join("")}</div>`;
  return `<details class="tiny"><summary style="cursor:pointer">${keys.slice(0,2).map(k => esc(t(FIELD_LABELS[k] || k))).join(", ")} ${t("and")} ${keys.length - 2} ${t("more")}</summary>${keys.map(line).join("")}</details>`;
}

let ACT = null;              // activity page filters
const ACT_PER_PAGE = 50;

function actFilterFromHash(){
  const qs = new URLSearchParams((location.hash.split("?")[1]) || "");
  const base = ACT || { from: todayISO(new Date(Date.now() - 30*86400e3)), to: todayISO(), actor: "", kind: "", q: "", page: 0 };
  ACT = Object.assign({}, base, { inst: qs.get("inst") || "", cust: qs.get("cust") || "", ref: qs.get("ref") || "" });
  if(ACT.inst){ Object.assign(ACT, { from: "", to: "", actor: "", kind: "", q: "", page: 0 }); }   // one record: its whole history
  else if(base.inst){ ACT.from = todayISO(new Date(Date.now() - 30*86400e3)); ACT.to = todayISO(); ACT.page = 0; }
  return ACT;
}

async function viewActivity(){
  if(!IS_ADMIN) return `<div class="page"><div class="card empty">${t("Only admins can see the activity log.")}</div></div>`;
  const f = actFilterFromHash();
  const [res, people] = await Promise.all([
    DataSource.listActivity(f, f.page, ACT_PER_PAGE),
    DataSource.activityActors().catch(() => [])
  ]);
  const pages = Math.max(1, Math.ceil(res.total / ACT_PER_PAGE));
  const when = at => { const d = new Date(at);
    return `${fmt(d)}<div class="src">${d.toLocaleTimeString(LANG === "zh" ? "zh-CN" : "en-GB", { hour: "2-digit", minute: "2-digit" })}</div>`; };
  const rows = res.rows.length ? res.rows.map(a => `
    <tr>
      <td class="mono act-when" style="white-space:nowrap">${when(a.at)}</td>
      <td>${a.actor ? esc(a.actor) : `<span class="pill n">${t("System")}</span>`}</td>
      <td><b>${esc(t(ACTIVITY_ACTIONS[a.action] || a.action))}</b>
        ${a.ref ? `<div class="src" style="text-transform:none;letter-spacing:0">${
          a.installation_id && a.action !== "record_deleted" && a.changes !== null
            ? `<a href="#/admin/${a.installation_id}">${esc(a.ref)}</a>` : esc(a.ref)}</div>` : ""}</td>
      <td style="min-width:220px">${actDetails(a)}</td>
    </tr>`).join("")
    : `<tr><td colspan="4" class="empty">${t("Nothing recorded for these filters.")}</td></tr>`;

  return `<div class="page">
    <button class="crumb" onclick="location.hash='#/admin/list'">&larr; ${t("Back to registry")}</button>
    <h1>${t("Activity log")}</h1>
    <p class="tiny muted" style="margin:6px 0 16px">${t("Every change made in the system, who made it and when. Only admins can see this page, and nobody can change it.")}</p>
    ${f.inst ? `<div class="removed-note">${t("Showing activity on")} <b>${esc(f.ref || ("#" + f.inst))}</b> ${t("only")}.
      <button class="lnk" id="actAll" style="margin-left:8px">${t("Show everything")}</button></div>` : ""}
    <div class="filters show" style="margin-bottom:14px">
      <div class="field"><label for="aFrom">${t("From")}</label><input id="aFrom" type="date" value="${esc(f.from)}"></div>
      <div class="field"><label for="aTo">${t("To")}</label><input id="aTo" type="date" value="${esc(f.to)}"></div>
      <div class="field"><label for="aWho">${t("Person")}</label>
        <select id="aWho"><option value="">${t("Everyone")}</option><option value="system">${t("System")}</option>
          ${people.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("")}</select></div>
      <div class="field"><label for="aKind">${t("Type")}</label>
        <select id="aKind"><option value="">${t("All")}</option>
          ${Object.entries(ACTIVITY_KINDS).map(([k, v]) => `<option value="${k}">${t(v.label)}</option>`).join("")}</select></div>
      <div class="field"><label for="aQ">${t("Warranty no. or customer")}</label><input id="aQ" value="${esc(f.q)}"></div>
      <div class="field" style="align-self:end"><button class="btn btn-p" id="aGo">${t("Show")}</button></div>
    </div>
    <div class="tablewrap"><table class="act">
      <thead><tr><th>${t("When")}</th><th>${t("Who")}</th><th>${t("What")}</th><th>${t("Details")}</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="pager">
      <span class="tiny muted">${res.total === 0 ? "" :
        `${t("Showing")} ${f.page*ACT_PER_PAGE+1}–${Math.min((f.page+1)*ACT_PER_PAGE, res.total)} ${t("of")} ${res.total}`}</span>
      ${pages > 1 ? `<span class="pgbtns">
        <button class="btn btn-s" id="aPrev" ${f.page===0?"disabled":""}>${t("Previous")}</button>
        <span class="tiny muted">${t("Page")} ${f.page+1} / ${pages}</span>
        <button class="btn btn-s" id="aNext" ${f.page>=pages-1?"disabled":""}>${t("Next")}</button></span>` : ""}
    </div>
  </div>`;
}

function wireActivity(){
  if(!ACT || !$("#aGo")) return;
  $("#aWho").value = ACT.actor; $("#aKind").value = ACT.kind;
  const go = () => {
    ACT.from = $("#aFrom").value; ACT.to = $("#aTo").value;
    ACT.actor = $("#aWho").value; ACT.kind = $("#aKind").value; ACT.q = $("#aQ").value.trim();
    ACT.page = 0; render();
  };
  $("#aGo").onclick = go;
  $("#aQ").addEventListener("keydown", e => { if(e.key === "Enter") go(); });
  const all = $("#actAll");
  if(all) all.onclick = () => { ACT.from = todayISO(new Date(Date.now() - 30*86400e3)); ACT.to = todayISO(); ACT.page = 0;
                                location.hash = "#/admin/activity"; };
  const pv = $("#aPrev"), nx = $("#aNext");
  if(pv) pv.onclick = () => { ACT.page--; render(); };
  if(nx) nx.onclick = () => { ACT.page++; render(); };
}

      <div id="acMsg"></div>
      <button class="btn btn-p btn-full" id="acGo">${t("Save my password")}</button>
    </div></div>`;

function passwordProblem(pw, pw2){
  const local = String(USER?.email || "").split("@")[0].toLowerCase();
  if(pw.length < 10) return t("The password must be at least 10 characters.");
  if(!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return t("Use both letters and numbers.");
  if(local.length >= 4 && pw.toLowerCase().includes(local)) return t("Do not use your email address in the password.");
  if(pw !== pw2) return t("The two passwords do not match.");
  return "";
}

function wireAccount(){
  const pw = $("#acPw"), pw2 = $("#acPw2"), go = $("#acGo"), msg = $("#acMsg");
  $("#acShow").onchange = e => { pw.type = pw2.type = e.target.checked ? "text" : "password"; };
  const save = async () => {
    const bad = passwordProblem(pw.value, pw2.value);
    if(bad){ msg.innerHTML = `<div class="err">${esc(bad)}</div>`; return; }
    const forced = mustSetPassword();
    go.disabled = true; go.textContent = t("Saving…");
    try{
      USER = await DataSource.changePassword(pw.value);
      DataSource.logEvent("password_changed");
      pw.value = pw2.value = "";
      msg.innerHTML = `<div class="ok">${t("Password saved. Use it the next time you sign in.")}</div>`;
      go.textContent = t("Save my password"); go.disabled = false;
      if(forced) setTimeout(() => { location.hash = "#/admin/list"; }, 1200);
    }catch(e){
      msg.innerHTML = `<div class="err">${esc(e.message || e)}</div>`;
      go.textContent = t("Save my password"); go.disabled = false;
    }
  };
  go.onclick = save;
  pw2.addEventListener("keydown", e => { if(e.key === "Enter") save(); });
  pw.focus();
}

async function render(){
  nav();
  /* Leaving the record means the next visit to it shows the pop-up again. */
  if(!/^#\/admin\/\d+$/.test(route())){
    BL_POPUP_FOR = null;
    const p = document.getElementById("blPop"); if(p) p.remove();
    const dp = document.getElementById("dupPop"); if(dp) dp.remove();
  }
  showConfigWarning();
  const r = route(), app = $("#app");

  if(r === "#/privacy"){ app.innerHTML = viewPrivacy(); return; }

  if(r === "#/check" || r === "#/"){
    app.innerHTML = viewCheck();
    $("#lkGo").onclick = doLookup;
    ["wn","pn"].forEach(id => $("#"+id).addEventListener("keydown", e => { if(e.key==="Enter") doLookup(); }));
    return;
  }

  if(r.startsWith("#/admin")){
    if(!USER){
      app.innerHTML = viewLogin();
      const go = async () => {
        const btn = $("#loginGo");

          stamp(Date.now()); setSessionStart(Date.now()); startSessionGuard();

          location.hash = "#/admin/list"; render();

      $("#loginGo").onclick = go;
      $("#pw").addEventListener("keydown", e => { if(e.key==="Enter") go(); });

    }

    /* First sign-in, or an admin reset the password: the person chooses their
       own password before anything else, so nobody else ever knows it. */
